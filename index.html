<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Master - 語彙力強化アプリ</title>
    <style>
        :root {
            /* 共通カラー */
            --primary-color: #4A90E2;
            --primary-hover: #357ABD;
            --primary-light: #E1EFFF;
            --correct-color: #4CAF50;
            --correct-bg: #E8F5E9;
            --incorrect-color: #F44336;
            --incorrect-bg: #FFEBEE;

            /* ライトモード用のカラー */
            --bg-color: #F8F9FA;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #E0E0E0;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);

            /* コンポーネント用のカラー変数 */
            --input-bg: #FAFAFA;
            --btn-sec-bg: #f0f0f0;
            --btn-sec-text: #333333;
            --btn-sec-hover: #e4e4e4;
            --q-bg: #f0f4f8;
            --trans-bg: #eef2f5;
            --trans-border: #8e9eab;
            --hover-bg: #f9f9f9;
            --acc-bg: #fafafa;
            --ex-bg: #ffffff;
            --ex-border: #eeeeee;
            --bm-bg: #ffffff;
            --bm-hover: #f9f9f9;
            --bm-active-bg: #fffdf5;
            --sidebar-list-bg: #ffffff;
            --sidebar-summary-bg: #f0f4f8;

            --transition: all 0.3s ease;
        }

        /* ダークモード用のカラー上書き */
        [data-theme="dark"] {
            --primary-color: #62A4F5;
            --primary-hover: #4A90E2;
            --primary-light: #1C2D42;
            --correct-color: #66BB6A;
            --correct-bg: #1E3324;
            --incorrect-color: #EF5350;
            --incorrect-bg: #3E1E22;

            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --text-main: #E0E0E0;
            --text-muted: #A0A0A0;
            --border-color: #333333;
            --shadow: 0 4px 6px rgba(0,0,0,0.5);

            --input-bg: #2C2C2C;
            --btn-sec-bg: #333333;
            --btn-sec-text: #E0E0E0;
            --btn-sec-hover: #444444;
            --q-bg: #2A2F35;
            --trans-bg: #25282B;
            --trans-border: #667582;
            --hover-bg: #2A2A2A;
            --acc-bg: #242424;
            --ex-bg: #2A2A2A;
            --ex-border: #444444;
            --bm-bg: #1E1E1E;
            --bm-hover: #2A2A2A;
            --bm-active-bg: #332B1A;
            --sidebar-list-bg: #1E1E1E;
            --sidebar-summary-bg: #2A2F35;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            scroll-behavior: smooth; 
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        #app {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 20px 30px 30px;
            min-height: 80vh;
            position: relative;
            box-sizing: border-box;
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }

        .hidden { display: none !important; }

        h2 { border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; margin-top: 0; }
        .nav-link { color: var(--primary-color); text-decoration: none; font-weight: bold; display: inline-block; cursor: pointer; }
        .nav-link:hover { text-decoration: underline; }

        button {
            background-color: var(--primary-color); color: white; border: none; padding: 10px 20px;
            border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: var(--transition);
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #cccccc; cursor: not-allowed; opacity: 0.5; }

        /* エディタ画面 */
        .editor-container { display: flex; flex-direction: column; gap: 15px; }
        .editor-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: -5px; }
        .btn-secondary { background-color: var(--btn-sec-bg); color: var(--btn-sec-text); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background-color: var(--btn-sec-hover); }

        textarea#json-input {
            width: 100%; height: 50vh; padding: 15px; border: 1px solid var(--border-color);
            border-radius: 8px; font-family: monospace; font-size: 14px; resize: vertical; box-sizing: border-box;
            background-color: var(--input-bg); color: var(--text-main); transition: var(--transition);
        }
        textarea#json-input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2); }
        .error-message { color: var(--incorrect-color); background-color: var(--incorrect-bg); padding: 10px; border-radius: 6px; font-size: 14px; font-weight: bold; }
        .editor-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px;}

        /* クイズ画面ヘッダー周り */
        .top-nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .menu-btn { background: none; color: var(--text-main); font-size: 24px; padding: 5px; box-shadow: none; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; margin-left: -5px; }
        .menu-btn:hover { background-color: var(--hover-bg); }

        .quiz-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; flex-wrap: wrap; gap: 10px;}
        .question-number { font-weight: bold; color: var(--text-muted); font-size: 18px; margin-bottom: 5px; }

        /* 矢印ナビゲーション */
        .arrow-nav-container { 
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; 
            transition: flex-direction 0.3s ease; 
        }
        .arrow-nav-container.swapped {
            flex-direction: row-reverse; 
        }
        .arrow-btn { 
            background: none; color: var(--primary-color); font-size: 32px; font-weight: bold; 
            width: 40px; display: flex; justify-content: center; align-items: center; padding: 0; 
            box-shadow: none; border-radius: 4px; 
            cursor: grab; 
            user-select: none; -webkit-user-select: none; touch-action: pan-y; 
        }
        .arrow-btn:active { cursor: grabbing; background-color: var(--primary-light); }
        .arrow-btn:hover { background-color: var(--primary-light); }
        .arrow-btn:disabled { color: var(--text-muted); background: none; cursor: not-allowed; opacity: 0.5; }

        /* スクロール位置とタップ領域の調整 */
        .question-text { font-size: 20px; font-weight: bold; margin-bottom: 15px; line-height: 1.5; padding: 15px; background: var(--q-bg); border-radius: 8px; border-left: 5px solid var(--primary-color); scroll-margin-top: 20px; cursor: pointer; transition: var(--transition); }
        .question-translation { font-size: 15px; color: var(--text-muted); margin-bottom: 25px; padding: 12px 15px; background: var(--trans-bg); border-radius: 6px; border-left: 5px solid var(--trans-border); font-weight: 500; animation: fadeIn 0.4s ease-in-out; scroll-margin-top: 20px; cursor: pointer; transition: var(--transition); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* 選択肢とアコーディオン */
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-item { border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; background: var(--card-bg); transition: var(--transition); scroll-margin-top: 20px; }
        .option-button { width: 100%; box-sizing: border-box; text-align: left; background: none; border: none; padding: 15px 20px; font-size: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--text-main); font-weight: 500; box-shadow: none; }
        .option-button:hover { background-color: var(--hover-bg); }

        .option-item.answered-correct { border-color: var(--correct-color); }
        .option-item.answered-correct .option-button { background-color: var(--correct-bg); color: var(--correct-color); font-weight: bold; }
        .option-item.answered-incorrect { border-color: var(--incorrect-color); }
        .option-item.answered-incorrect .option-button { background-color: var(--incorrect-bg); color: var(--incorrect-color); }

        .accordion-content { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease; background-color: var(--acc-bg); }
        .accordion-inner { overflow: hidden; }
        .accordion-body { padding: 0 20px 20px 20px; cursor: pointer; }
        .option-item.open .accordion-content { grid-template-rows: 1fr; }
        .option-item.open .option-button { border-bottom: 1px solid var(--border-color); }

        /* 選択肢ごとのブックマークアイコン */
        .opt-bookmark-btn {
            cursor: pointer;
            color: #dcdcdc;
            font-size: 20px;
            transition: var(--transition);
            display: inline-block;
            user-select: none;
            order: 2;
            margin-left: auto;
            margin-right: 15px;
        }
        .opt-bookmark-btn:hover { color: #f5a623; }
        .opt-bookmark-btn.active { color: #f5a623; }

        /* テキスト部分 */
        .option-text { 
            flex-grow: 1; 
            text-align: left; 
            order: 1;
            user-select: text;
            -webkit-user-select: text;
        }
        .icon-toggle { order: 3; user-select: none; }

        body.nav-swapped .opt-bookmark-btn { 
            order: 1; 
            margin-left: 0;
            margin-right: 12px; 
        }
        body.nav-swapped .option-text { order: 2; }


        .result-mark { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .mark-o { color: var(--correct-color); }
        .mark-x { color: var(--incorrect-color); }
        .meaning-text { font-weight: bold; margin-bottom: 8px; font-size: 15px; }
        .example-text { color: var(--text-muted); font-size: 14px; line-height: 1.5; font-style: italic; background: var(--ex-bg); padding: 10px; border-radius: 6px; border: 1px solid var(--ex-border); transition: var(--transition); }

        /* 設問全体のブックマークボタン */
        #bookmark-btn {
            background-color: var(--bm-bg);
            color: #ccc;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        #bookmark-btn:hover { background-color: var(--bm-hover); }
        #bookmark-btn.active { color: #f5a623; border-color: #f5a623; background-color: var(--bm-active-bg); }

        /* フッターナビゲーション */
        .bottom-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        /* 復習ページ: コントロールレイアウト */
        .review-controls-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .review-controls-left {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .review-controls-right {
            margin-left: auto;
        }

        /* 検索とプルダウンのレイアウト */
        .search-group {
            display: flex;
            gap: 5px;
            width: 100%;
        }
        .search-input-wrapper {
            position: relative;
            flex-grow: 1;
        }
        .search-input-wrapper span {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        #review-search-input {
            width: 100%;
            padding: 8px 10px 8px 35px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-main);
            font-family: inherit;
            box-sizing: border-box;
            transition: var(--transition);
            font-size: 14px;
        }
        #review-search-input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2); }
        
        .review-filters-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        #review-difficulty-filter,
        #review-sort-order,
        #review-per-page {
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-main);
            font-family: inherit;
            font-size: 14px;
            width: auto;
        }

        /* ページネーション（復習ページ用） */
        .pagination-container {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
            transition: flex-direction 0.3s ease; 
        }
        
        /* ページネーション反転用 */
        .pagination-container.swapped {
            flex-direction: row-reverse; 
        }

        .pagination-numbers {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            flex-grow: 1; 
        }

        .pagination-btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            min-width: 36px;
            text-align: center;
            transition: var(--transition);
        }
        .pagination-btn:hover:not(:disabled):not(.active) {
            background-color: var(--hover-bg);
        }
        .pagination-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            cursor: default;
        }
        
        /* カスタムモーダル */
        #jump-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 101;
            width: 80%;
            max-width: 300px;
            text-align: center;
        }

        /* サイドバー共通 */
        .sidebar-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 99; opacity: 0; visibility: hidden; transition: var(--transition); }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        .sidebar { position: fixed; top: 0; width: 260px; height: 100%; background: var(--card-bg); z-index: 100; box-shadow: 2px 0 8px rgba(0,0,0,0.1); overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .sidebar-header { font-size: 18px; font-weight: bold; border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; margin-bottom: 15px; color: var(--primary-color); display: flex; justify-content: space-between; align-items: center;}
        .close-sidebar-btn { background: none; border: none; font-size: 24px; color: var(--text-muted); cursor: pointer; padding: 0; box-shadow: none; height: 30px; width: 30px; line-height: 1;}
        .close-sidebar-btn:hover { color: var(--incorrect-color); }

        /* 左サイドバー（メニュー） */
        .left-sidebar { left: -300px; transition: left 0.3s ease; }
        .left-sidebar.open { left: 0; }

        /* 右サイドバー（設定） */
        .right-sidebar { right: -300px; transition: right 0.3s ease; left: auto; }
        .right-sidebar.open { right: 0; }

        .sidebar-filters { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
        .sidebar-filters select { padding: 6px; border-radius: 4px; border: 1px solid var(--border-color); width: 100%; font-family: inherit; background-color: var(--input-bg); color: var(--text-main); }
        .sidebar-filters label { display: flex; align-items: center; gap: 5px; cursor: pointer; }

        .sidebar details { margin-bottom: 10px; border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; }
        .sidebar summary { background: var(--sidebar-summary-bg); padding: 12px 15px; font-weight: bold; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; user-select: none; color: var(--text-main); }
        .sidebar summary::-webkit-details-marker { display: none; }
        .sidebar summary::after { content: "▼"; font-size: 12px; transition: transform 0.3s ease; }
        .sidebar details[open] summary::after { transform: rotate(180deg); }
        .sidebar details[open] summary { border-bottom: 1px solid var(--border-color); background: var(--primary-light); color: var(--primary-hover); }

        .sidebar-list { padding: 5px 0; background: var(--sidebar-list-bg);}
        .sidebar-item { padding: 10px 20px; font-size: 14px; color: var(--text-main); cursor: pointer; border-left: 4px solid transparent; transition: all 0.2s; }
        .sidebar-item:hover { background: var(--hover-bg); }
        .sidebar-item.active { background: var(--primary-light); font-weight: bold; color: var(--primary-color); border-left-color: var(--primary-color); }

        /* 単語選択用フローティングポップアップ（コンパクト＆下部編集＋一覧展開対応） */
        #word-picker-popup {
            position: fixed;
            bottom: 24px;
            right: 20px;
            z-index: 90;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
            padding: 5px 6px 6px 5px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 196px;
            max-width: calc(100vw - 16px);
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            opacity: 0.96;
        }
        /* 一覧表示モード時：画面の横半分・縦半分の大きさ */
        #word-picker-popup.list-open {
            width: 50vw;
            min-width: 280px;
            max-width: 92vw;
            max-height: 85vh;
            opacity: 0.99;
        }
        .word-picker-top-row {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        #word-picker-handle {
            cursor: move;
            touch-action: none;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1;
            padding: 4px 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .word-picker-btn {
            padding: 5px 8px;
            font-size: 12px;
            border-radius: 5px;
            white-space: nowrap;
            line-height: 1.2;
            flex: 1;
        }
        .word-picker-btn-list {
            background-color: var(--btn-sec-bg);
            color: var(--btn-sec-text);
            border: 1px solid var(--border-color);
        }
        .word-picker-btn-list:hover {
            background-color: var(--btn-sec-hover);
        }
        .word-picker-btn-list.active {
            background-color: var(--primary-light);
            color: var(--primary-color);
            border-color: var(--primary-color);
        }
        #word-picker-input {
            width: 100%;
            min-height: 26px;
            max-height: 120px;
            padding: 4px 6px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background-color: var(--input-bg);
            color: var(--text-main);
            font-family: inherit;
            font-size: 12.5px;
            line-height: 1.35;
            box-sizing: border-box;
            resize: none;
            overflow-y: hidden;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
            user-select: text;
            -webkit-user-select: text;
            flex-shrink: 0;
        }
        #word-picker-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 1px rgba(74, 144, 226, 0.3);
        }

        /* 保存済み単語一覧パネル（高さ固定＆縦スクロール＋小型ページネーション） */
        #word-picker-list-panel {
            display: flex;
            flex-direction: column;
            height: 50vh;
            max-height: calc(100vh - 150px);
            min-height: 0;
            overflow: hidden;
            border-top: 1px solid var(--border-color);
            padding-top: 6px;
            margin-top: 2px;
            box-sizing: border-box;
        }
        .word-picker-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            padding: 0 2px 6px;
            border-bottom: 1px dashed var(--border-color);
            margin-bottom: 4px;
            flex-shrink: 0;
        }
        #word-picker-list-body {
            flex: 1 1 0%;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 2px;
        }
        .word-picker-list-pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding-top: 6px;
            margin-top: 4px;
            border-top: 1px dashed var(--border-color);
            flex-shrink: 0;
        }
        .word-picker-page-btn {
            background-color: var(--btn-sec-bg);
            color: var(--btn-sec-text);
            border: 1px solid var(--border-color);
            padding: 2px 10px;
            font-size: 12px;
            border-radius: 4px;
            line-height: 1.4;
        }
        .word-picker-page-btn:hover:not(:disabled) {
            background-color: var(--btn-sec-hover);
        }
        .word-picker-page-btn:disabled {
            background-color: var(--btn-sec-bg);
            color: var(--text-muted);
            opacity: 0.4;
            cursor: not-allowed;
        }
        .word-picker-page-info {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: bold;
            min-width: 48px;
            text-align: center;
        }
        .saved-word-row {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--input-bg);
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .saved-word-actions {

        }
        .saved-word-btn-cancel {
            background-color: var(--btn-sec-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .saved-word-btn-cancel:hover {
            background-color: var(--btn-sec-hover);
            color: var(--text-main);
        }
        .saved-word-btn-del {
            background: none;
            color: var(--incorrect-color);
            border: 1px solid var(--incorrect-color);
        }
        .saved-word-btn-del:hover {
            background-color: var(--incorrect-bg);
        }
        .saved-word-text {

            -webkit-user-select: text;

            flex: 1;
            min-width: 0;
            width: 100%;
            min-height: 26px;
            padding: 3px 6px;

            border-radius: 4px;
            background-color: var(--card-bg);
            color: var(--text-main);
            font-family: inherit;
            font-size: 13px;
            line-height: 1.4;
            box-sizing: border-box;
            resize: none;
            overflow-y: hidden;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-wrap: anywhere;
            user-select: text;
            -webkit-user-select: text;
        }
        .saved-word-edit-input:focus {
            outline: none;
            box-shadow: 0 0 0 1px rgba(74, 144, 226, 0.35);
        }
        .saved-word-empty {
            text-align: center;
            color: var(--text-muted);
            font-size: 12.5px;
            padding: 20px 8px;
        }

        #word-picker-toast {
            position: fixed;
            bottom: 72px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.9);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 120;
            pointer-events: none;
            opacity: 0;

            white-space: nowrap;
            max-width: 90vw;

            text-overflow: ellipsis;

        #word-picker-toast.show {
            opacity: 1;
        }
        .radio-row {

            align-items: center;
            justify-content: space-between;

        .radio-options {

            gap: 8px;

            color: var(--incorrect-color);
            border: 1px solid var(--incorrect-color);
            padding: 5px 12px;
            font-size: 12px;
        }
        .btn-danger-outline:hover {
            background-color: var(--incorrect-bg);

    </style>
</head>

<div id="app">
    <!-- 読み込みデータ編集画面 -->

                <p id="login-desc" style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">Googleアカウントでログインすると、別の端末でもブックマークや保存した単語が同期されます。</p>

                    <circle cx="12" cy="12" r="3"></circle>

    <!-- 復習ページ画面 -->
    <div id="review-view" class="view hidden">
        <!-- 上段：戻る ＋ 詳細設定 -->

            <button onclick="app.toggleSettings(true)" class="btn-secondary" style="font-weight: normal; font-size: 13px; padding: 6px 12px; border-radius: 20px; display: flex; align-items: center; gap: 5px;">
