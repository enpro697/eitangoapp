<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyC49VpvSo7xhcX4ytc1XVvswTYRryFeDHM",
    authDomain: "vocabmaster-6736a.firebaseapp.com",
    projectId: "vocabmaster-6736a",
    storageBucket: "vocabmaster-6736a.firebasestorage.app",
    messagingSenderId: "460606872770",
    appId: "1:460606872770:web:58faf647864b979975ef5b"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const app = {
    allData: [],      
    data: [],         
    bookmarkedIds: [], 
    bookmarkedOptions: {}, 
    savedJsonString: "[]",
    currentIndex: 0,
    isAllAccordionsOpen: false,
    user: null,

    isNavSwapped: false,
    isSwiping: false,
    
    reviewData: [],
    reviewCurrentPage: 0,
    reviewPerPage: 10,
    reviewSortOrder: 'asc',
    isReviewAccordionsOpen: false,
    lastReviewTopItem: null,

    // 新機能：単語選択・保存リスト（クラウド同期＋一覧編集＋小型ページネーション対応）
    savedWords: [],
    isWordSelectMode: false,
    isWordListOpen: false,
    editingWordIndex: null,
    savedWordsPage: 0,
    savedWordsPerPage: 20,
    cachedSelection: "",
    cachedSelectionTime: 0,
    toastTimer: null,

    REMOTE_JSON_URL: "https://raw.githubusercontent.com/enpro697/eitangoapp/refs/heads/main/eitango1.json",

    init() {
        this.initTheme();

        this.allData = [];
        this.data = [];
        this.bookmarkedOptions = {};

        this.loadFromLocalStorage();
        this.initWordPicker();

        const jsonInput = document.getElementById('json-input');
        jsonInput.value = this.savedJsonString;
        jsonInput.addEventListener('input', () => this.validateJsonInput());

        onAuthStateChanged(auth, (user) => {
            const loginBtn = document.getElementById('login-btn');
            const syncBtn = document.getElementById('sync-btn');

            if (user) {
                this.user = user;
                if (loginBtn) {
                    loginBtn.innerText = "ログアウト";
                    loginBtn.style.backgroundColor = "#757575"; 
                }
                if (syncBtn) syncBtn.style.display = "block";
            } else {
                this.user = null;
                if (loginBtn) {
                    loginBtn.innerText = "Googleでログイン";
                    loginBtn.style.backgroundColor = "#db4437"; 
                }
                if (syncBtn) syncBtn.style.display = "none";

                const loginDesc = document.getElementById('login-desc');
                if (loginDesc) loginDesc.innerText = "Googleアカウントでログインすると、別の端末でもブックマークや保存した単語が同期されます。";
            }
            this.loadBookmarks();
        });

        window.addEventListener('online', () => {
            const isUnsynced = localStorage.getItem('vocab_unsynced') === 'true';
            if (isUnsynced && this.user) {
                const loginDesc = document.getElementById('login-desc');
                if (loginDesc) loginDesc.innerHTML = `<span style="color: #ff9800; font-weight: bold;">⚠ オンライン復帰：</span> 未同期のデータがあります。「クラウド同期」ボタンを押してください。`;
            }
        });

        const savedSwap = localStorage.getItem('vocab_nav_swapped');
        if (savedSwap === 'true') {
            this.isNavSwapped = true;
            document.getElementById('arrow-nav-container').classList.add('swapped');
            document.getElementById('review-pagination').classList.add('swapped');
            document.body.classList.add('nav-swapped');
        }

        this.setupDragAndLongPress();
        this.fetchRemoteData(false);
        this.setupGlobalClickListeners();
    },

    /* =========================================================
       新機能：単語選択・フローティングポップアップ＆一覧編集関連
       ========================================================= */
    initWordPicker() {
        this.updateSavedWordsUI();

        const pickerInput = document.getElementById('word-picker-input');
        if (pickerInput) {
            // Enterキー（変換確定中やShift+Enterを除く）でそのまま追加
            pickerInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                    e.preventDefault();
                    this.addSelectedWord();
                }
            });
        }

        // 選択中のテキストを監視し、ポップアップ下部の編集エリアへ自動反映
        document.addEventListener('selectionchange', () => {
            const sel = window.getSelection();
            if (!sel) return;

            const inputEl = document.getElementById('word-picker-input');
            const popupEl = document.getElementById('word-picker-popup');

            // ポップアップ内の入力欄や一覧パネル内を編集中・選択中なら上書きしない
            if (document.activeElement && popupEl && popupEl.contains(document.activeElement)) return;
            if (popupEl && ((sel.anchorNode && popupEl.contains(sel.anchorNode)) || (sel.focusNode && popupEl.contains(sel.focusNode)))) {
                return;
            }

            const text = sel.toString().trim();
            if (text) {
                const normalized = text.replace(/\s+/g, ' ').trim();
                this.cachedSelection = normalized;
                this.cachedSelectionTime = Date.now();
                if (this.isWordSelectMode && inputEl) {
                    inputEl.value = normalized;
                    this.autoResizeWordPickerInput();
                }
            }
        });

        // 保存されていたON/OFF状態を復元
        const savedMode = localStorage.getItem('vocab_word_select_mode') === 'true';
        const radio = document.querySelector(`input[name="word-select-mode"][value="${savedMode ? 'on' : 'off'}"]`);
        if (radio) radio.checked = true;
        this.setWordSelectMode(savedMode, false);

        // ポップアップのドラッグ移動を初期化
        this.setupWordPickerDrag();

        // 画面リサイズ時にポップアップが画面外に出ないよう補正
        window.addEventListener('resize', () => {
            if (this.isWordSelectMode) this.clampWordPickerPosition();
        });
    },

    autoResizeTextarea(el, minH = 26, maxH = 120) {
        if (!el) return;
        el.style.height = 'auto';
        const nextH = Math.min(Math.max(el.scrollHeight, minH), maxH);
        el.style.height = `${nextH}px`;
        el.style.overflowY = el.scrollHeight > maxH ? 'auto' : 'hidden';
    },

    autoResizeWordPickerInput() {
        const inputEl = document.getElementById('word-picker-input');
        this.autoResizeTextarea(inputEl, 26, 120);
        this.clampWordPickerPosition();
    },

    clampWordPickerPosition() {
        const popup = document.getElementById('word-picker-popup');
        if (!popup || popup.classList.contains('hidden')) return;
        if (popup.style.left === '' && popup.style.top === '') return;

        const rect = popup.getBoundingClientRect();
        const maxX = Math.max(4, window.innerWidth - rect.width - 4);
        const maxY = Math.max(4, window.innerHeight - rect.height - 4);
        const x = Math.min(Math.max(4, rect.left), maxX);
        const y = Math.min(Math.max(4, rect.top), maxY);
        popup.style.left = `${x}px`;
        popup.style.top = `${y}px`;
    },

    setWordSelectMode(enabled, save = true) {
        this.isWordSelectMode = enabled;
        if (save) {
            localStorage.setItem('vocab_word_select_mode', String(enabled));
        }
        const popup = document.getElementById('word-picker-popup');
        if (!popup) return;
        if (enabled) {
            popup.classList.remove('hidden');
            this.restoreWordPickerPosition();
            this.autoResizeWordPickerInput();
        } else {
            this.toggleSavedWordsList(false);
            popup.classList.add('hidden');
        }
    },

    restoreWordPickerPosition() {
        const popup = document.getElementById('word-picker-popup');
        if (!popup) return;
        try {
            const posStr = localStorage.getItem('vocab_word_picker_pos');
            if (!posStr) return;
            const pos = JSON.parse(posStr);
            const maxX = Math.max(0, window.innerWidth - popup.offsetWidth - 8);
            const maxY = Math.max(0, window.innerHeight - popup.offsetHeight - 8);
            const x = Math.min(Math.max(8, pos.x), maxX);
            const y = Math.min(Math.max(8, pos.y), maxY);
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;
            popup.style.right = 'auto';
            popup.style.bottom = 'auto';
        } catch (e) {}
    },

    setupWordPickerDrag() {
        const popup = document.getElementById('word-picker-popup');
        const handle = document.getElementById('word-picker-handle');
        if (!popup || !handle) return;

        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;

        const startDrag = (clientX, clientY) => {
            const rect = popup.getBoundingClientRect();
            isDragging = true;
            offsetX = clientX - rect.left;
            offsetY = clientY - rect.top;
            popup.style.left = `${rect.left}px`;
            popup.style.top = `${rect.top}px`;
            popup.style.right = 'auto';
            popup.style.bottom = 'auto';
        };

        const moveDrag = (clientX, clientY) => {
            if (!isDragging) return;
            const maxX = Math.max(0, window.innerWidth - popup.offsetWidth - 4);
            const maxY = Math.max(0, window.innerHeight - popup.offsetHeight - 4);
            const newX = Math.min(Math.max(4, clientX - offsetX), maxX);
            const newY = Math.min(Math.max(4, clientY - offsetY), maxY);
            popup.style.left = `${newX}px`;
            popup.style.top = `${newY}px`;
        };

        const endDrag = () => {
            if (!isDragging) return;
            isDragging = false;
            const rect = popup.getBoundingClientRect();
            localStorage.setItem('vocab_word_picker_pos', JSON.stringify({ x: rect.left, y: rect.top }));
        };

        handle.addEventListener('mousedown', (e) => {
            e.preventDefault();
            startDrag(e.clientX, e.clientY);
        });
        document.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
        document.addEventListener('mouseup', endDrag);

        handle.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            startDrag(t.clientX, t.clientY);
        }, { passive: true });
        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const t = e.touches[0];
            moveDrag(t.clientX, t.clientY);
        }, { passive: true });
        document.addEventListener('touchend', endDrag);
    },

    captureCurrentSelection() {
        const popupEl = document.getElementById('word-picker-popup');
        const inputEl = document.getElementById('word-picker-input');
        if (document.activeElement && popupEl && popupEl.contains(document.activeElement)) return;
        const sel = window.getSelection();
        const text = sel ? sel.toString().trim() : "";
        if (text) {
            const normalized = text.replace(/\s+/g, ' ').trim();
            this.cachedSelection = normalized;
            this.cachedSelectionTime = Date.now();
            if (inputEl && !inputEl.value.trim()) {
                inputEl.value = normalized;
                this.autoResizeWordPickerInput();
            }
        }
    },

    addSelectedWord() {
        const inputEl = document.getElementById('word-picker-input');
        const sel = window.getSelection();

        // 1. まず下部の編集エリアの文字列を優先（編集後・手入力の文字列を反映）
        let text = inputEl ? inputEl.value.trim() : "";

        // 2. 入力欄が空なら現在の選択範囲または直近キャッシュを参照
        if (!text) {
            text = sel ? sel.toString().trim() : "";
        }
        if (!text && this.cachedSelection && (Date.now() - this.cachedSelectionTime < 2000)) {
            text = this.cachedSelection;
        }

        if (!text) {
            this.showToast("単語を範囲選択または入力してください");
            return;
        }

        // 改行や連続空白を1スペースに整形
        const normalized = text.replace(/\s+/g, ' ').trim();
        const isDuplicate = this.savedWords.some(w => w.toLowerCase() === normalized.toLowerCase());

        if (isDuplicate) {
            const proceed = confirm(`「${normalized}」はすでに保存済みです。\n重複して追加しますか？`);
            if (!proceed) return;
        }

        this.savedWords.push(normalized);
        this.editingWordIndex = null;
        this.savedWordsPage = 0;
        this.saveSavedWords();
        this.cachedSelection = "";

        if (inputEl) {
            inputEl.value = "";
            this.autoResizeWordPickerInput();
            if (document.activeElement === inputEl) {
                inputEl.blur();
            }
        }
        if (sel && sel.removeAllRanges) {
            try { sel.removeAllRanges(); } catch (e) {}
        }
        if (this.isWordListOpen) {
            this.renderSavedWordsList();
        }
        this.showToast(`追加: ${normalized} (${this.savedWords.length}件)`);
    },

    toggleSavedWordsList(forceState = null) {
        const nextState = (typeof forceState === 'boolean') ? forceState : !this.isWordListOpen;
        this.isWordListOpen = nextState;

        const popup = document.getElementById('word-picker-popup');
        const panel = document.getElementById('word-picker-list-panel');
        const btn = document.getElementById('word-picker-list-btn');
        if (!popup || !panel || !btn) return;

        if (this.isWordListOpen) {
            this.editingWordIndex = null;
            this.savedWordsPage = 0;
            popup.classList.add('list-open');
            panel.classList.remove('hidden');
            btn.classList.add('active');
            btn.innerText = '閉じる';
            this.renderSavedWordsList();
            requestAnimationFrame(() => this.clampWordPickerPosition());
        } else {
            this.editingWordIndex = null;
            popup.classList.remove('list-open');
            panel.classList.add('hidden');
            btn.classList.remove('active');
            btn.innerText = '一覧表示';
            this.restoreWordPickerPosition();
        }
    },

    changeSavedWordsPage(delta) {
        const totalPages = Math.max(1, Math.ceil(this.savedWords.length / this.savedWordsPerPage));
        const nextPage = this.savedWordsPage + delta;
        if (nextPage < 0 || nextPage >= totalPages) return;
        this.savedWordsPage = nextPage;
        this.editingWordIndex = null;
        this.renderSavedWordsList();
        const body = document.getElementById('word-picker-list-body');
        if (body) body.scrollTop = 0;
    },

    renderSavedWordsList() {
        const body = document.getElementById('word-picker-list-body');
        const countEl = document.getElementById('word-picker-list-count');
        const pagEl = document.getElementById('word-picker-list-pagination');
        const pageInfoEl = document.getElementById('word-picker-page-info');
        const prevBtn = document.getElementById('word-picker-page-prev');
        const nextBtn = document.getElementById('word-picker-page-next');

        if (countEl) countEl.innerText = this.savedWords.length;
        if (!body) return;

        body.innerHTML = '';

        if (this.savedWords.length === 0) {
            body.innerHTML = '<div class="saved-word-empty">保存されている単語はありません。</div>';
            if (pagEl) pagEl.classList.add('hidden');
            return;
        }

        const totalPages = Math.max(1, Math.ceil(this.savedWords.length / this.savedWordsPerPage));
        if (this.savedWordsPage >= totalPages) {
            this.savedWordsPage = totalPages - 1;
        }
        if (this.savedWordsPage < 0) {
            this.savedWordsPage = 0;
        }

        if (pagEl) pagEl.classList.remove('hidden');
        if (pageInfoEl) pageInfoEl.innerText = `${this.savedWordsPage + 1} / ${totalPages}`;
        if (prevBtn) prevBtn.disabled = (this.savedWordsPage === 0);
        if (nextBtn) nextBtn.disabled = (this.savedWordsPage >= totalPages - 1);

        // 新しい順（配列の末尾から先頭へ）で現在ページ分を描画
        const startOffset = this.savedWordsPage * this.savedWordsPerPage;
        const endOffset = Math.min(startOffset + this.savedWordsPerPage, this.savedWords.length);

        for (let offset = startOffset; offset < endOffset; offset++) {
            const idx = this.savedWords.length - 1 - offset;
            const word = this.savedWords[idx];
            const isEditing = (this.editingWordIndex === idx);

            const row = document.createElement('div');
            row.className = 'saved-word-row';

            const actions = document.createElement('div');
            actions.className = 'saved-word-actions';

            const editBtn = document.createElement('button');
            editBtn.type = 'button';
            editBtn.className = `saved-word-action-btn ${isEditing ? 'saved-word-btn-done' : 'saved-word-btn-edit'}`;
            editBtn.innerText = isEditing ? '完了' : '編集';
            editBtn.onclick = () => {
                if (isEditing) {
                    this.finishEditSavedWord(idx);
                } else {
                    this.startEditSavedWord(idx);
                }
            };
            actions.appendChild(editBtn);

            // パターン2：通常時のみ「削除」を表示（編集中は非表示にして入力欄を広く確保）
            if (!isEditing) {
                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'saved-word-action-btn saved-word-btn-del';
                delBtn.innerText = '削除';
                delBtn.onclick = () => this.deleteSavedWord(idx);
                actions.appendChild(delBtn);
            }

            row.appendChild(actions);

            if (isEditing) {
                const textarea = document.createElement('textarea');
                textarea.id = `saved-word-edit-${idx}`;
                textarea.className = 'saved-word-edit-input';
                textarea.rows = 1;
                textarea.value = word;
                textarea.oninput = () => this.autoResizeTextarea(textarea, 26, 200);
                textarea.onkeydown = (e) => {
                    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                        e.preventDefault();
                        this.finishEditSavedWord(idx);
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        this.cancelEditSavedWord(idx);
                    }
                };
                row.appendChild(textarea);

                // 右端に「戻す」ボタンを配置
                const cancelBtn = document.createElement('button');
                cancelBtn.type = 'button';
                cancelBtn.className = 'saved-word-action-btn saved-word-btn-cancel';
                cancelBtn.innerText = '戻す';
                cancelBtn.onclick = () => this.cancelEditSavedWord(idx);
                row.appendChild(cancelBtn);

                requestAnimationFrame(() => {
                    this.autoResizeTextarea(textarea, 26, 200);
                    textarea.focus();
                    textarea.setSelectionRange(textarea.value.length, textarea.value.length);
                });
            } else {
                const textDiv = document.createElement('div');
                textDiv.className = 'saved-word-text';
                textDiv.textContent = word;
                row.appendChild(textDiv);
            }

            body.appendChild(row);
        }
    },

    startEditSavedWord(idx) {
        this.editingWordIndex = idx;
        this.renderSavedWordsList();
    },

    cancelEditSavedWord(idx) {
        const inputEl = document.getElementById(`saved-word-edit-${idx}`);
        if (inputEl) inputEl.blur();
        this.editingWordIndex = null;
        this.renderSavedWordsList();
    },

    finishEditSavedWord(idx) {
        const inputEl = document.getElementById(`saved-word-edit-${idx}`);
        if (!inputEl) {
            this.editingWordIndex = null;
            this.renderSavedWordsList();
            return;
        }
        const updated = inputEl.value.replace(/\s+/g, ' ').trim();
        if (!updated) {
            alert("空文字では保存できません。削除する場合は「戻す」後に「削除」ボタンを押してください。");
            inputEl.focus();
            return;
        }

        inputEl.blur();
        this.savedWords[idx] = updated;
        this.editingWordIndex = null;
        this.saveSavedWords();
        this.renderSavedWordsList();
        this.showToast(`更新: ${updated}`);
    },

    deleteSavedWord(idx) {
        const target = this.savedWords[idx];
        if (target === undefined) return;

        if (!confirm(`「${target}」を削除しますか？`)) {
            return;
        }

        this.savedWords.splice(idx, 1);
        this.editingWordIndex = null;
        this.saveSavedWords();
        this.renderSavedWordsList();
        this.showToast(`削除: ${target} (残り${this.savedWords.length}件)`);
    },

    saveSavedWords() {
        localStorage.setItem('vocab_saved_words', JSON.stringify(this.savedWords));
        this.updateSavedWordsUI();
        // ブックマークと同様にクラウド同期・オフライン未同期フラグ管理を実行
        this.saveBookmarks();
    },

    updateSavedWordsUI() {
        const copyBtn = document.getElementById('copy-saved-words-btn');
        if (copyBtn) {
            copyBtn.innerText = `保存済単語一括コピー (${this.savedWords.length})`;
        }
        const listCount = document.getElementById('word-picker-list-count');
        if (listCount) {
            listCount.innerText = this.savedWords.length;
        }
    },

    async copySavedWords() {
        if (this.savedWords.length === 0) {
            alert("保存されている単語はありません。");
            return;
        }
        const text = this.savedWords.join('\n');
        try {
            await navigator.clipboard.writeText(text);
            alert(`${this.savedWords.length}件の単語をコピーしました！`);
        } catch (err) {
            alert("コピーに失敗しました。ブラウザの権限を確認してください。");
        }
    },

    clearSavedWords() {
        if (this.savedWords.length === 0) {
            alert("削除する単語はありません。");
            return;
        }
        if (confirm(`保存済みの単語 ${this.savedWords.length}件 をすべて削除しますか？`)) {
            this.savedWords = [];
            this.editingWordIndex = null;
            this.savedWordsPage = 0;
            this.saveSavedWords();
            if (this.isWordListOpen) {
                this.renderSavedWordsList();
            }
            this.showToast("保存済み単語を一括削除しました");
        }
    },

    showToast(message) {
        const toast = document.getElementById('word-picker-toast');
        if (!toast) return;
        toast.innerText = message;
        toast.classList.add('show');
        if (this.toastTimer) clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 1800);
    },

    hasTextSelection() {
        const sel = window.getSelection();
        return !!(sel && sel.toString().trim().length > 0);
    },

    scrollToElement(el) {
        if (!el) return;
        const offset = window.innerHeight / 3;
        const y = el.getBoundingClientRect().top + window.scrollY - offset;
        window.scrollTo({ top: y, behavior: 'smooth' });
    },

    initTheme() {
        const savedTheme = localStorage.getItem('vocab_theme') || 'auto';
        const themeSelect = document.getElementById('theme-select');
        if(themeSelect) themeSelect.value = savedTheme;
        this.applyTheme(savedTheme);

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (localStorage.getItem('vocab_theme') === 'auto') {
                this.applyTheme('auto');
            }
        });
    },

    changeTheme() {
        const themeSelect = document.getElementById('theme-select');
        if(!themeSelect) return;
        const theme = themeSelect.value;
        localStorage.setItem('vocab_theme', theme);
        this.applyTheme(theme);
    },

    applyTheme(theme) {
        if (theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.removeAttribute('data-theme');
        }
    },

    toggleSettings(show) {
        const sidebar = document.getElementById('settings-sidebar');
        const overlay = document.getElementById('settings-overlay');
        if (show) {
            sidebar.classList.add('open');
            overlay.classList.add('active');
        } else {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }
    },

    toggleNavSwap() {
        this.isNavSwapped = !this.isNavSwapped;
        localStorage.setItem('vocab_nav_swapped', this.isNavSwapped);

        const container = document.getElementById('arrow-nav-container');
        const reviewContainer = document.getElementById('review-pagination');
        
        if (this.isNavSwapped) {
            container.classList.add('swapped');
            if(reviewContainer) reviewContainer.classList.add('swapped');
            document.body.classList.add('nav-swapped');
        } else {
            container.classList.remove('swapped');
            if(reviewContainer) reviewContainer.classList.remove('swapped');
            document.body.classList.remove('nav-swapped');
        }
        
        if (!document.getElementById('review-view').classList.contains('hidden')) {
            this.updateReviewPagination();
        }

        if (navigator.vibrate) navigator.vibrate(50);
    },

    // PCドラッグ＆スマホスワイプを両方カバーする処理
    attachNavSwapListeners(btn) {
        if (!btn) return;
        
        btn.draggable = true;
        btn.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('text/plain', 'nav-swap');
            e.target.style.opacity = '0.5';
        });
        btn.addEventListener('dragend', (e) => {
            e.target.style.opacity = '1';
        });
        
        let startX = 0;
        let startY = 0;
        
        btn.addEventListener('touchstart', (e) => {
            startX = e.changedTouches[0].clientX;
            startY = e.changedTouches[0].clientY;
            this.isSwiping = false;
        }, { passive: true });
        
        btn.addEventListener('touchmove', (e) => {
            const curX = e.changedTouches[0].clientX;
            const curY = e.changedTouches[0].clientY;
            if (Math.abs(curX - startX) > 30 && Math.abs(curX - startX) > Math.abs(curY - startY)) {
                this.isSwiping = true;
            }
        }, { passive: true });
        
        btn.addEventListener('touchend', (e) => {
            if (this.isSwiping) {
                this.toggleNavSwap();
                setTimeout(() => { this.isSwiping = false; }, 300);
            }
        });
    },

    setupDragAndLongPress() {
        const prevBtn = document.getElementById('btn-prev');
        const nextBtn = document.getElementById('btn-next');
        this.attachNavSwapListeners(prevBtn);
        this.attachNavSwapListeners(nextBtn);
        
        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => {
            if (e.dataTransfer.getData('text/plain') === 'nav-swap') {
                e.preventDefault();
                this.toggleNavSwap();
            }
        });
    },

    async toggleLogin() {
        if (this.user) {
            await signOut(auth);
            alert("ログアウトしました。これ以降の変更はローカルにのみ保存されます。");
        } else {
            const provider = new GoogleAuthProvider();
            try { await signInWithPopup(auth, provider); } 
            catch(error) { console.error("ログインエラー", error); }
        }
    },

    setupGlobalClickListeners() {
        document.addEventListener('click', (e) => {
            const isQuizView = !document.getElementById('quiz-view').classList.contains('hidden');
            const isReviewView = !document.getElementById('review-view').classList.contains('hidden');

            if (!isQuizView && !isReviewView) return;
            if (this.hasTextSelection()) return;
            if (e.target.closest('#word-picker-popup')) return;
            if (e.target.closest('.opt-bookmark-btn') || e.target.closest('button') || e.target.closest('a') || e.target.closest('select') || e.target.closest('input') || e.target.closest('textarea')) return;
            if (e.target.closest('#jump-modal')) return;

            if (isReviewView) {
                const accordionBody = e.target.closest('.accordion-body');
                if (accordionBody) {
                    const optionItem = accordionBody.closest('.option-item');
                    const allItems = Array.from(document.querySelectorAll('#review-list-container .option-item'));
                    const currentIndex = allItems.indexOf(optionItem);

                    let targetItem = null;
                    for (let i = currentIndex + 1; i < allItems.length; i++) {
                        if (allItems[i].classList.contains('open')) {
                            targetItem = allItems[i];
                            break;
                        }
                    }
                    if (targetItem) {
                        this.scrollToElement(targetItem);
                    } else {
                        const firstOpen = allItems.find(item => item.classList.contains('open'));
                        if (firstOpen) {
                            this.scrollToElement(firstOpen);
                        } else {
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        }
                    }
                    return;
                }
            }

            if (isQuizView) {
                if (e.target.closest('#question-text')) {
                    this.toggleAllAccordions();
                    return;
                }
                if (e.target.closest('#question-translation')) {
                    const options = Array.from(document.querySelectorAll('#options-container .option-item'));
                    const correctIndex = options.findIndex(opt => opt.classList.contains('answered-correct'));
                    if (correctIndex !== -1) {
                        let targetIndex = correctIndex + 1;
                        if (targetIndex >= options.length) targetIndex = 0;
                        const targetEl = document.getElementById(`option-item-${targetIndex}`);
                        this.scrollToElement(targetEl);
                    }
                    return;
                }
                const accordionBody = e.target.closest('.accordion-body');
                if (accordionBody) {
                    const optionItem = accordionBody.closest('.option-item');
                    const options = Array.from(document.querySelectorAll('#options-container .option-item'));
                    const currentIndex = options.indexOf(optionItem);

                    if (optionItem.classList.contains('answered-correct')) {
                        this.scrollToElement(document.getElementById('question-text'));
                    } else {
                        let targetIndex = currentIndex + 1;
                        if (targetIndex >= options.length) {
                            const transEl = document.getElementById('question-translation');
                            if (!transEl.classList.contains('hidden')) {
                                this.scrollToElement(transEl);
                            } else {
                                this.scrollToElement(document.getElementById('question-text'));
                            }
                        } else {
                            const targetEl = document.getElementById(`option-item-${targetIndex}`);
                            this.scrollToElement(targetEl);
                        }
                    }
                    return;
                }
            }
            
            const isSidebarAction = e.target.closest('.sidebar') || e.target.closest('.sidebar-overlay');
            const isModalAction = e.target.closest('#jump-overlay') || e.target.closest('#jump-modal');
            const isOptionButton = e.target.closest('.option-button');

            if (!isSidebarAction && !isModalAction && !isOptionButton) {
                const clickX = e.clientX;
                const screenWidth = window.innerWidth;
                const appEl = document.getElementById('app');

                const goPrev = () => {
                    if (isQuizView) this.prevPage();
                    if (isReviewView) this.prevReviewPage();
                };
                const goNext = () => {
                    if (isQuizView) this.nextPage();
                    if (isReviewView) this.nextReviewPage();
                };

                if (!appEl.contains(e.target) || e.target === appEl) {
                    if (clickX < screenWidth / 2) {
                        this.isNavSwapped ? goNext() : goPrev();
                    } else {
                        this.isNavSwapped ? goPrev() : goNext();
                    }
                    return;
                }

                if (clickX < screenWidth * 0.15) {
                    this.isNavSwapped ? goNext() : goPrev();
                    return;
                }
                if (clickX > screenWidth * 0.85) {
                    this.isNavSwapped ? goPrev() : goNext();
                    return;
                }
            }
        });
    },

    async loadBookmarks() {
        const isUnsynced = localStorage.getItem('vocab_unsynced') === 'true';

        if (this.user) {
            if (isUnsynced) {
                this.loadFromLocalStorage();
                const loginDesc = document.getElementById('login-desc');
                if (loginDesc) {
                    loginDesc.innerHTML = `<span style="color: #ff9800; font-weight: bold;">⚠ 未同期の変更あり：</span> オフライン時の変更が残っています。「クラウド同期」ボタンを押して保存してください。`;
                }
            } else {
                try {
                    const docRef = doc(db, "users", this.user.uid);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const dbData = docSnap.data();
                        this.bookmarkedIds = dbData.bookmarks || [];
                        this.bookmarkedOptions = dbData.bookmarkedOptions || {};
                        if (Array.isArray(dbData.savedWords)) {
                            this.savedWords = dbData.savedWords;
                            localStorage.setItem('vocab_saved_words', JSON.stringify(this.savedWords));
                        }
                        localStorage.setItem('vocab_bookmarks', JSON.stringify(this.bookmarkedIds)); 
                        localStorage.setItem('vocab_bookmarked_options', JSON.stringify(this.bookmarkedOptions));
                    }
                    const loginDesc = document.getElementById('login-desc');
                    if (loginDesc) {
                        loginDesc.innerHTML = `<span style="color: var(--correct-color); font-weight: bold;">✓ 同期有効：</span> ${this.user.displayName || 'ユーザー'} としてログイン中です。`;
                    }
                } catch(e) { 
                    this.loadFromLocalStorage();
                }
            }
        } else {
            this.loadFromLocalStorage();
        }

        this.updateBookmarkUI();
        this.updateSavedWordsUI();
        if (this.isWordListOpen) {
            this.renderSavedWordsList();
        }
        this.renderSidebar();

        if (document.getElementById('bookmark-filter').checked) {
            this.applyFilters();
        }
    },

    loadFromLocalStorage() {
        try {
            const savedIds = localStorage.getItem('vocab_bookmarks');
            this.bookmarkedIds = savedIds ? JSON.parse(savedIds) : [];
            const savedOpts = localStorage.getItem('vocab_bookmarked_options');
            this.bookmarkedOptions = savedOpts ? JSON.parse(savedOpts) : {};
            const storedWords = localStorage.getItem('vocab_saved_words');
            this.savedWords = storedWords ? JSON.parse(storedWords) : [];
        } catch (e) {
            this.bookmarkedIds = [];
            this.bookmarkedOptions = {};
            this.savedWords = [];
        }
    },

    async saveBookmarks() {
        localStorage.setItem('vocab_bookmarks', JSON.stringify(this.bookmarkedIds));
        localStorage.setItem('vocab_bookmarked_options', JSON.stringify(this.bookmarkedOptions));
        localStorage.setItem('vocab_saved_words', JSON.stringify(this.savedWords));

        if (this.user) {
            localStorage.setItem('vocab_unsynced', 'true');

            if (!navigator.onLine) {
                const loginDesc = document.getElementById('login-desc');
                if (loginDesc) {
                    loginDesc.innerHTML = `<span style="color: #ff9800; font-weight: bold;">⚠ オフライン：</span> 変更はローカルに保存されました。後で同期してください。`;
                }
                return;
            }

            try {
                await setDoc(doc(db, "users", this.user.uid), {
                    bookmarks: this.bookmarkedIds,
                    bookmarkedOptions: this.bookmarkedOptions,
                    savedWords: this.savedWords
                }, { merge: true });

                localStorage.removeItem('vocab_unsynced');

                const loginDesc = document.getElementById('login-desc');
                if (loginDesc) {
                    loginDesc.innerHTML = `<span style="color: var(--correct-color); font-weight: bold;">✓ 同期有効：</span> ${this.user.displayName || 'ユーザー'} としてログイン中です。`;
                }
            } catch(e) {
                const loginDesc = document.getElementById('login-desc');
                if (loginDesc) {
                    loginDesc.innerHTML = `<span style="color: #ff9800; font-weight: bold;">⚠ 同期エラー：</span> 変更はローカルに保存されました。後で同期してください。`;
                }
            }
        }
    },

    async syncAndCleanBookmarks() {
        if (!this.user) {
            alert("ログインしていません。");
            return;
        }
        if (!navigator.onLine) {
            alert("現在オフラインのため同期できません。通信環境の良いところで再度お試しください。");
            return;
        }
        if (!this.allData || this.allData.length === 0) {
            alert("単語データが読み込まれていません。先に「クラウドから最新データを取得」するか、データを取り込んでください。");
            return;
        }

        const validIds = new Set(this.allData.map(q => String(q.id)));
        const originalCount = this.bookmarkedIds.length;

        this.bookmarkedIds = this.bookmarkedIds.filter(id => validIds.has(id));

        const cleanedOptions = {};
        for (const [qId, options] of Object.entries(this.bookmarkedOptions)) {
            if (validIds.has(qId)) {
                cleanedOptions[qId] = options;
            }
        }
        this.bookmarkedOptions = cleanedOptions;

        const removedCount = originalCount - this.bookmarkedIds.length;

        try {
            localStorage.setItem('vocab_bookmarks', JSON.stringify(this.bookmarkedIds));
            localStorage.setItem('vocab_bookmarked_options', JSON.stringify(this.bookmarkedOptions));
            localStorage.setItem('vocab_saved_words', JSON.stringify(this.savedWords));

            await setDoc(doc(db, "users", this.user.uid), {
                bookmarks: this.bookmarkedIds,
                bookmarkedOptions: this.bookmarkedOptions,
                savedWords: this.savedWords
            }, { merge: true });

            localStorage.removeItem('vocab_unsynced');

            const loginDesc = document.getElementById('login-desc');
            if (loginDesc) {
                loginDesc.innerHTML = `<span style="color: var(--correct-color); font-weight: bold;">✓ 同期有効：</span> ${this.user.displayName || 'ユーザー'} としてログイン中です。`;
            }

            let msg = `クラウドと同期し、ブックマークと保存済み単語(${this.savedWords.length}件)を反映しました！\n`;
            if (removedCount > 0) {
                msg += `（過去の無効なゴミデータ ${removedCount} 件を削除しました）`;
            } else {
                msg += "（不要なゴミデータはありませんでした）";
            }
            alert(msg);

            this.updateBookmarkUI();
            this.updateSavedWordsUI();
            if (this.isWordListOpen) {
                this.renderSavedWordsList();
            }
            this.renderSidebar();
            if (document.getElementById('bookmark-filter').checked) {
                this.applyFilters();
            }
        } catch (error) {
            alert("同期に失敗しました。通信環境を確認してください。");
        }
    },

    async copyText() {
        const ta = document.getElementById('json-input');
        if (!ta.value) return;
        try {
            await navigator.clipboard.writeText(ta.value);
            alert("JSONデータをクリップボードにコピーしました！");
        } catch (err) {
            alert("コピーに失敗しました。手動でコピーしてください。");
        }
    },

    toggleBookmark() {
        const q = this.data[this.currentIndex];
        if (!q) return;

        const qId = String(q.id);
        const idx = this.bookmarkedIds.indexOf(qId);

        if (idx > -1) {
            this.bookmarkedIds.splice(idx, 1);
            delete this.bookmarkedOptions[qId];

            const stars = document.querySelectorAll('.opt-bookmark-btn');
            stars.forEach(s => {
                s.innerText = '☆';
                s.classList.remove('active');
            });
        } else {
            this.bookmarkedIds.push(qId);
        }

        this.saveBookmarks();
        this.updateBookmarkUI();
        this.renderSidebar();

        if (document.getElementById('bookmark-filter').checked && idx > -1) {
            this.applyFilters();
        }
    },

    toggleOptionBookmark(event, qId, wordStr, index) {
        event.stopPropagation();

        if (!this.bookmarkedOptions[qId]) {
            this.bookmarkedOptions[qId] = [];
        }

        const idx = this.bookmarkedOptions[qId].indexOf(wordStr);
        const starEl = document.getElementById(`opt-star-${index}`);

        if (idx > -1) {
            this.bookmarkedOptions[qId].splice(idx, 1);
            if (starEl) {
                starEl.innerText = '☆';
                starEl.classList.remove('active');
            }

            if (this.bookmarkedOptions[qId].length === 0) {
                delete this.bookmarkedOptions[qId];
                const qIdx = this.bookmarkedIds.indexOf(qId);
                if (qIdx > -1) this.bookmarkedIds.splice(qIdx, 1);
            }
        } else {
            this.bookmarkedOptions[qId].push(wordStr);
            if (starEl) {
                starEl.innerText = '★';
                starEl.classList.add('active');
            }

            if (!this.bookmarkedIds.includes(qId)) {
                this.bookmarkedIds.push(qId);
            }
        }

        this.saveBookmarks();
        this.updateBookmarkUI();
        this.renderSidebar();

        if (document.getElementById('bookmark-filter').checked && !this.bookmarkedIds.includes(qId)) {
            this.applyFilters();
        }
    },

    updateBookmarkUI() {
        const q = this.data[this.currentIndex];
        const btn = document.getElementById('bookmark-btn');
        if (!q) {
            btn.style.display = 'none';
            return;
        }
        btn.style.display = 'block';

        if (this.bookmarkedIds.includes(String(q.id))) {
            btn.classList.add('active');
            btn.innerText = '★ 設問ブックマーク済';
        } else {
            btn.classList.remove('active');
            btn.innerText = '☆ 設問をブックマーク';
        }
    },

    async fetchRemoteData(isManualClick = false) {
        try {
            if (isManualClick) document.getElementById('json-input').value = "通信中...";

            const response = await fetch(this.REMOTE_JSON_URL); 
            if (!response.ok) throw new Error("Network response was not ok");

            const rawText = await response.text();
            const remoteData = this.parseCustomJSON(rawText); 

            const formattedJson = JSON.stringify(remoteData, null, 2);
            document.getElementById('json-input').value = formattedJson;

            this.importData();

            if (isManualClick) alert("クラウドから最新の単語データを取得し、適用しました！");
        } catch (error) {
            if (isManualClick) {
                alert("データの取得・解析に失敗しました。JSONの記述にエラーがある可能性があります。");
                document.getElementById('json-input').value = this.savedJsonString;
            }
        }
    },

    parseCustomJSON(inputStr) {
        try { return JSON.parse(inputStr); } 
        catch(e) {
            let fixedStr = inputStr.replace(/\]\s*[^\[\]\{\}]*\s*\[/g, ',');
            try { return JSON.parse(fixedStr); } 
            catch(e2) { throw new Error("Invalid JSON format"); }
        }
    },

    normalizeAndReassignIds(rawData) {
        let flatQuestions = [];
        const extractQuestions = (data) => {
            if (Array.isArray(data)) {
                data.forEach(item => extractQuestions(item));
            } else if (data && typeof data === 'object') {
                if (data.question || data.options || data.choices || data.punchline || data.sentence) {
                    flatQuestions.push(data);
                } else if (Array.isArray(data.questions)) {
                    extractQuestions(data.questions);
                } else {
                    for (const key in data) {
                        if (typeof data[key] === 'object') extractQuestions(data[key]);
                    }
                }
            }
        };
        extractQuestions(rawData);

        flatQuestions.forEach((q, index) => {
            if (!q.id) q.id = 'temp_' + (index + 1);
        });

        return flatQuestions;
    },

    validateJsonInput() {
        const inputVal = document.getElementById('json-input').value;
        const errorMsg = document.getElementById('json-error');
        const importBtn = document.getElementById('import-btn');

        if (!inputVal.trim()) {
            errorMsg.classList.add('hidden');
            importBtn.disabled = true;
            return;
        }
        try {
            this.parseCustomJSON(inputVal);
            errorMsg.classList.add('hidden');
            const isDifferent = (inputVal.trim() !== this.savedJsonString);
            importBtn.disabled = !isDifferent;
        } catch (e) {
            errorMsg.classList.remove('hidden');
            importBtn.disabled = true;
        }
    },

    importData() {
        const inputVal = document.getElementById('json-input').value;
        try {
            let parsedData = this.parseCustomJSON(inputVal);
            parsedData = this.normalizeAndReassignIds(parsedData);

            this.allData = parsedData; 
            this.savedJsonString = JSON.stringify(this.allData, null, 2);
            document.getElementById('json-input').value = this.savedJsonString; 
            document.getElementById('import-btn').disabled = true;

            this.applyFilters(); 
            this.switchView('quiz');
        } catch (e) {
            alert('データの取り込みに失敗しました。');
        }
    },

    applyFilters() {
        const diffVal = document.getElementById('difficulty-filter').value;
        const onlyBookmark = document.getElementById('bookmark-filter').checked;

        this.data = this.allData.filter(q => {
            let matchDiff = true;
            if (diffVal !== 'all') {
                matchDiff = (String(q.difficulty) === String(diffVal));
            }
            let matchBookmark = true;
            if (onlyBookmark) {
                matchBookmark = this.bookmarkedIds.includes(String(q.id));
            }
            return matchDiff && matchBookmark;
        });

        this.currentIndex = 0;
        this.renderSidebar();

        if (this.data.length > 0) {
            this.renderQuiz();
        } else {
            document.getElementById('question-text').innerText = "条件に一致する問題がありません。フィルタを変更してください。";
            document.getElementById('options-container').innerHTML = "";
            document.getElementById('question-translation').classList.add('hidden');
            document.getElementById('q-current').innerText = 0;
            document.getElementById('q-total').innerText = 0;
            document.getElementById('btn-prev').disabled = true;
            document.getElementById('btn-next').disabled = true;
            document.getElementById('bookmark-btn').style.display = 'none';
        }
    },

    clearText() {
        document.getElementById('json-input').value = '';
        this.validateJsonInput();
    },

    scrollToBottom() {
        const ta = document.getElementById('json-input');
        ta.scrollTop = ta.scrollHeight;
    },

    switchView(viewName) {
        const isFromEditor = !document.getElementById('editor-view').classList.contains('hidden');

        document.getElementById('editor-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.add('hidden');
        document.getElementById('review-view').classList.add('hidden');
        
        const reviewSettingsGroup = document.getElementById('review-settings-group');
        if(reviewSettingsGroup) {
            reviewSettingsGroup.style.display = (viewName === 'review') ? 'block' : 'none';
        }
        
        document.getElementById(`${viewName}-view`).classList.remove('hidden');

        if (viewName === 'quiz' && this.data.length > 0) {
            if (isFromEditor) {
                let highestIndex = 0;
                for (let i = this.data.length - 1; i >= 0; i--) {
                    if (this.bookmarkedIds.includes(String(this.data[i].id))) {
                        highestIndex = i;
                        break;
                    }
                }
                this.currentIndex = highestIndex;
            }
            this.renderQuiz();
        } else if (viewName === 'review') {
            this.buildReviewData(true);
            this.renderReview();
        }
    },

    renderQuiz() {
        if (!this.data || this.data.length === 0) return;

        this.isAllAccordionsOpen = false;
        const q = this.data[this.currentIndex];

        document.getElementById('q-current').innerText = this.currentIndex + 1;
        document.getElementById('q-total').innerText = this.data.length;
        document.getElementById('question-text').innerText = q.question || q.word || "問題文がありません";

        const transDiv = document.getElementById('question-translation');
        transDiv.innerText = q.question_ja || q.meaning || q.translation || "";
        transDiv.classList.add('hidden');

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        if (!q.options && !q.choices) {
            container.innerHTML = '<div style="padding: 20px;">この問題には選択肢データがありません。</div>';
            return;
        }

        let shuffledOptions = q.options ? [...q.options] : [...q.choices];
        for (let i = shuffledOptions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledOptions[i], shuffledOptions[j]] = [shuffledOptions[j], shuffledOptions[i]];
        }

        shuffledOptions.forEach((opt, index) => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'option-item';
            itemDiv.id = `option-item-${index}`;

            let wordStr = opt.word || opt;
            let meaningStr = Array.isArray(opt.meanings) ? opt.meanings.join(', ') : (opt.meanings || "");
            let isCorrect = opt.is_correct === true || q.answer === wordStr || q.answer_index === index;
            let exampleStr = opt.example || q.example || q.sentence || q.punchline || "";

            let isOptionBookmarked = this.bookmarkedOptions[q.id] && this.bookmarkedOptions[q.id].includes(wordStr);
            let escapedWordStr = wordStr.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

            itemDiv.innerHTML = `
                <div class="option-button" role="button" tabindex="0" onclick="app.handleOptionClick(${index}, ${isCorrect})">
                    <span id="opt-star-${index}" class="opt-bookmark-btn ${isOptionBookmarked ? 'active' : ''}" 
                          onclick="app.toggleOptionBookmark(event, '${q.id}', '${escapedWordStr}', ${index})">
                        ${isOptionBookmarked ? '★' : '☆'}
                    </span>
                    <span class="option-text">${index + 1}. ${wordStr}</span>
                    <span class="icon-toggle">▼</span>
                </div>
                <div class="accordion-content">
                    <div class="accordion-inner">
                        <div class="accordion-body">
                            <div class="result-mark ${isCorrect ? 'mark-o' : 'mark-x'}">
                                ${isCorrect ? '〇 正解' : '× 不正解'}
                            </div>
                            ${meaningStr ? `<div class="meaning-text">意味: ${meaningStr}</div>` : ''}
                            <div class="example-text">"${exampleStr}"</div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(itemDiv);
        });

        this.updateNavButtons();
        this.updateSidebarHighlight();
        this.updateBookmarkUI();
        window.scrollTo({ top: 0, behavior: 'auto' }); 
    },

    handleNavClick(direction, event) {
        if (this.isSwiping) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            return;
        }
        if (Date.now() - (this.lastSwapTime || 0) < 300) return;
        if (direction === 'prev') this.prevPage();
        else if (direction === 'next') this.nextPage();
    },

    handleOptionClick(index, isCorrect) {
        if (this.hasTextSelection()) return;

        const item = document.getElementById(`option-item-${index}`);
        if (item.classList.contains('open')) {
            item.classList.remove('open');
        } else {
            item.classList.add('open');
            item.classList.add(isCorrect ? 'answered-correct' : 'answered-incorrect');
        }
        
        this.checkTranslationVisibility();

        if (item.classList.contains('open') && isCorrect) {
            setTimeout(() => {
                const transEl = document.getElementById('question-translation');
                if (transEl && !transEl.classList.contains('hidden')) {
                    this.scrollToElement(transEl);
                } else {
                    this.scrollToElement(document.getElementById('question-text'));
                }
            }, 300);
        }
    },

    toggleAllAccordions() {
        this.isAllAccordionsOpen = !this.isAllAccordionsOpen;
        const items = document.querySelectorAll('#quiz-view .option-item');
        let correctItem = null;

        items.forEach((item) => {
            const isCorrect = item.querySelector('.mark-o') !== null;
            if (this.isAllAccordionsOpen) {
                item.classList.add('open');
                item.classList.add(isCorrect ? 'answered-correct' : 'answered-incorrect');
                if (isCorrect) correctItem = item; 
            } else {
                item.classList.remove('open');
            }
        });
        
        this.checkTranslationVisibility();

        if (this.isAllAccordionsOpen && correctItem) {
            setTimeout(() => {
                this.scrollToElement(correctItem);
            }, 300);
        }
    },

    checkTranslationVisibility() {
        const openItemsCount = document.querySelectorAll('#quiz-view .option-item.open').length;
        const transDiv = document.getElementById('question-translation');
        if (openItemsCount > 0 && transDiv.innerText.trim() !== "") {
            transDiv.classList.remove('hidden');
        } else {
            transDiv.classList.add('hidden');
        }
    },

    prevPage() {
        if (this.currentIndex > 0) {
            this.currentIndex--;
            this.renderQuiz();
        }
    },

    nextPage() {
        if (this.currentIndex < this.data.length - 1) {
            this.currentIndex++;
            this.renderQuiz();
        }
    },

    goToPage(index) {
        if (index >= 0 && index < this.data.length) {
            this.currentIndex = index;
            this.renderQuiz();
        }
    },

    updateNavButtons() {
        document.getElementById('btn-prev').disabled = (this.currentIndex === 0);
        document.getElementById('btn-next').disabled = (this.currentIndex === this.data.length - 1);
    },

    toggleSidebar(show) {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        if (show) {
            sidebar.classList.add('open');
            overlay.classList.add('active');
        } else {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }
    },

    renderSidebar() {
        const container = document.getElementById('sidebar-content');
        container.innerHTML = '';

        if(this.data.length === 0) {
             container.innerHTML = '<div style="padding: 10px; color: var(--text-muted); font-size: 14px;">該当する問題がありません。</div>';
             return;
        }

        const groupSize = 50;
        const totalGroups = Math.ceil(this.data.length / groupSize);

        for (let g = 0; g < totalGroups; g++) {
            const start = g * groupSize + 1;
            const end = Math.min((g + 1) * groupSize, this.data.length);

            const details = document.createElement('details');
            const summary = document.createElement('summary');
            summary.innerText = `${start} 〜 ${end} 件目`;
            details.appendChild(summary);

            const list = document.createElement('div');
            list.className = 'sidebar-list';

            for (let i = start - 1; i < end; i++) {
                const item = document.createElement('div');
                item.className = 'sidebar-item';
                item.id = `sidebar-item-${i}`;

                const qId = String(this.data[i].id);
                const isBookmarked = this.bookmarkedIds.includes(qId);
                const icon = isBookmarked ? '★ ' : '';

                item.innerText = `${icon}Question ${i + 1}`;
                item.onclick = () => {
                    this.goToPage(i);
                    this.toggleSidebar(false);
                };
                list.appendChild(item);
            }
            details.appendChild(list);
            container.appendChild(details);
        }
    },

    updateSidebarHighlight() {
        document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
        const activeEl = document.getElementById(`sidebar-item-${this.currentIndex}`);
        if (activeEl) {
            activeEl.classList.add('active');
            const parentDetails = activeEl.closest('details');
            if (parentDetails) parentDetails.open = true;
            activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    },

    applyReviewFilters() {
        this.buildReviewData(false);
        this.renderReview();
    },

    buildReviewData(restorePosition = true) {
        let lastTopItem = null;
        if (this.reviewData.length > 0 && restorePosition && this.lastReviewTopItem) {
            lastTopItem = this.lastReviewTopItem;
        }

        const searchQuery = (document.getElementById('review-search-input')?.value || '').toLowerCase();
        const diffFilter = document.getElementById('review-difficulty-filter')?.value || 'all';

        this.reviewData = [];
        for (const q of this.allData) {
            if (diffFilter !== 'all' && String(q.difficulty) !== String(diffFilter)) continue;

            const bOpts = this.bookmarkedOptions[q.id];
            if (bOpts && bOpts.length > 0) {
                const options = q.options || q.choices || [];
                for (const opt of options) {
                    let wordStr = opt.word || opt;
                    if (bOpts.includes(wordStr)) {
                        let meaningStr = Array.isArray(opt.meanings) ? opt.meanings.join(', ') : (opt.meanings || "");
                        let exampleStr = opt.example || q.example || q.sentence || q.punchline || "";

                        if (searchQuery) {
                            const targetText = `${wordStr} ${meaningStr} ${exampleStr}`.toLowerCase();
                            if (!targetText.includes(searchQuery)) continue;
                        }

                        this.reviewData.push({
                            qId: String(q.id),
                            wordStr: wordStr,
                            meaningStr: meaningStr,
                            exampleStr: exampleStr
                        });
                    }
                }
            }
        }
        
        if (this.reviewSortOrder === 'desc') {
            this.reviewData.reverse();
        }
        
        if (restorePosition && lastTopItem && this.reviewData.length > 0) {
            const foundIndex = this.reviewData.findIndex(item => item.qId === lastTopItem.qId && item.wordStr === lastTopItem.wordStr);
            if (foundIndex !== -1) {
                this.reviewCurrentPage = Math.floor(foundIndex / this.reviewPerPage);
            } else {
                this.reviewCurrentPage = 0;
            }
        } else if (!restorePosition) {
            this.reviewCurrentPage = 0;
        }
    },

    renderReview() {
        const container = document.getElementById('review-list-container');
        container.innerHTML = '';

        if (this.reviewData.length === 0) {
            container.innerHTML = '<div style="padding: 30px; text-align: center; color: var(--text-muted); background: var(--hover-bg); border-radius: 8px;">該当するブックマークがありません。</div>';
            this.updateReviewPagination();
            this.lastReviewTopItem = null;
            return;
        }

        this.isReviewAccordionsOpen = false;

        const startIdx = this.reviewCurrentPage * this.reviewPerPage;
        const endIdx = Math.min(startIdx + this.reviewPerPage, this.reviewData.length);

        for (let i = startIdx; i < endIdx; i++) {
            const item = this.reviewData[i];
            const itemDiv = document.createElement('div');
            itemDiv.className = 'option-item';
            itemDiv.id = `review-item-${i}`;

            let escapedWordStr = item.wordStr.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            let isOptionBookmarked = this.bookmarkedOptions[item.qId] && this.bookmarkedOptions[item.qId].includes(item.wordStr);

            itemDiv.innerHTML = `
                <div class="option-button" role="button" tabindex="0" onclick="app.handleReviewOptionClick(${i})">
                    <span id="review-star-${i}" class="opt-bookmark-btn ${isOptionBookmarked ? 'active' : ''}" 
                          onclick="app.toggleReviewBookmark(event, '${item.qId}', '${escapedWordStr}', ${i})">
                        ${isOptionBookmarked ? '★' : '☆'}
                    </span>
                    <span class="option-text">${item.wordStr}</span>
                    <span class="icon-toggle">▼</span>
                </div>
                <div class="accordion-content">
                    <div class="accordion-inner">
                        <div class="accordion-body" style="padding-top: 10px;">
                            ${item.meaningStr ? `<div class="meaning-text" style="color: var(--primary-color);">意味: ${item.meaningStr}</div>` : ''}
                            ${item.exampleStr ? `<div class="example-text">"${item.exampleStr}"</div>` : ''}
                            ${!item.meaningStr && !item.exampleStr ? '<div class="example-text">詳細データがありません</div>' : ''}
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(itemDiv);
        }
        
        if (this.reviewData.length > 0) {
            this.lastReviewTopItem = this.reviewData[startIdx];
        }

        this.updateReviewPagination();
        window.scrollTo({ top: 0, behavior: 'auto' });
    },

    handleReviewOptionClick(index) {
        if (this.hasTextSelection()) return;

        const item = document.getElementById(`review-item-${index}`);
        if (item.classList.contains('open')) {
            item.classList.remove('open');
        } else {
            item.classList.add('open');
        }
    },

    toggleReviewAccordions() {
        this.isReviewAccordionsOpen = !this.isReviewAccordionsOpen;
        const items = document.querySelectorAll('#review-view .option-item');
        items.forEach((item) => {
            if (this.isReviewAccordionsOpen) {
                item.classList.add('open');
            } else {
                item.classList.remove('open');
            }
        });
    },

    toggleReviewBookmark(event, qId, wordStr, index) {
        event.stopPropagation();

        const starEl = document.getElementById(`review-star-${index}`);
        const isCurrentlyBookmarked = starEl.classList.contains('active');

        if (isCurrentlyBookmarked) {
            if (this.bookmarkedOptions[qId]) {
                const idx = this.bookmarkedOptions[qId].indexOf(wordStr);
                if (idx > -1) {
                    this.bookmarkedOptions[qId].splice(idx, 1);
                }
                if (this.bookmarkedOptions[qId].length === 0) {
                    delete this.bookmarkedOptions[qId];
                    const qIdx = this.bookmarkedIds.indexOf(qId);
                    if (qIdx > -1) this.bookmarkedIds.splice(qIdx, 1);
                }
            }
            starEl.innerText = '☆';
            starEl.classList.remove('active');
        } else {
            if (!this.bookmarkedOptions[qId]) {
                this.bookmarkedOptions[qId] = [];
            }
            if (!this.bookmarkedOptions[qId].includes(wordStr)) {
                this.bookmarkedOptions[qId].push(wordStr);
            }
            if (!this.bookmarkedIds.includes(qId)) {
                this.bookmarkedIds.push(qId);
            }
            starEl.innerText = '★';
            starEl.classList.add('active');
        }

        this.saveBookmarks();
        this.updateBookmarkUI();
        this.renderSidebar();
    },

    changeReviewSortOrder() {
        this.reviewSortOrder = document.getElementById('review-sort-order').value;
        this.reviewCurrentPage = 0; 
        this.buildReviewData(false);
        this.renderReview();
    },

    changeReviewPerPage() {
        this.reviewPerPage = parseInt(document.getElementById('review-per-page').value, 10);
        this.reviewCurrentPage = 0; 
        this.buildReviewData(false);
        this.renderReview();
    },

    openJumpModal() {
        const totalPages = Math.ceil(this.reviewData.length / this.reviewPerPage) || 1;
        const overlay = document.getElementById('jump-overlay');
        const modal = document.getElementById('jump-modal');
        const desc = document.getElementById('jump-modal-desc');
        const input = document.getElementById('jump-input');
        
        desc.innerText = `1 から ${totalPages} のページ番号を入力`;
        input.value = this.reviewCurrentPage + 1;
        input.max = totalPages;
        input.min = 1;
        
        overlay.classList.add('active');
        modal.style.display = 'block';
        
        setTimeout(() => {
            input.focus();
            input.select();
        }, 100);
        
        input.onkeydown = (e) => {
            if (e.key === 'Enter') this.executeJump();
        };
    },

    closeJumpModal() {
        document.getElementById('jump-input').blur(); 
        document.getElementById('jump-overlay').classList.remove('active');
        document.getElementById('jump-modal').style.display = 'none';
    },

    executeJump() {
        const input = document.getElementById('jump-input');
        const val = parseInt(input.value, 10);
        const totalPages = Math.ceil(this.reviewData.length / this.reviewPerPage) || 1;
        
        const dummy = document.createElement('input');
        dummy.style.position = 'absolute';
        dummy.style.opacity = '0';
        dummy.style.top = '-9999px';
        document.body.appendChild(dummy);
        dummy.focus();
        setTimeout(() => {
            dummy.blur();
            document.body.removeChild(dummy);
        }, 50);
        
        if (!isNaN(val) && val >= 1 && val <= totalPages) {
            this.reviewCurrentPage = val - 1;
            this.renderReview();
            this.closeJumpModal();
        } else {
            alert(`1 から ${totalPages} の間の数字を入力してください。`);
            input.focus();
        }
    },

    prevReviewPage() {
        if (this.reviewCurrentPage > 0) {
            this.reviewCurrentPage--;
            this.renderReview();
        }
    },

    nextReviewPage() {
        const totalPages = Math.ceil(this.reviewData.length / this.reviewPerPage);
        if (this.reviewCurrentPage < totalPages - 1) {
            this.reviewCurrentPage++;
            this.renderReview();
        }
    },

    updateReviewPagination() {
        const pagination = document.getElementById('review-pagination');
        const jumpLink = document.getElementById('review-jump-link');
        pagination.innerHTML = '';

        if (this.reviewData.length === 0) {
            if (jumpLink) jumpLink.style.display = 'none';
            return;
        }
        
        const totalPages = Math.ceil(this.reviewData.length / this.reviewPerPage) || 1;
        if (jumpLink) {
            jumpLink.style.display = 'inline-block';
        }

        const createBtn = (text, pageIdx, disabled = false, active = false, isNav = false, navType = '') => {
            if (text === '...') {
                const span = document.createElement('span');
                span.innerText = '...';
                span.style.padding = '6px 2px';
                span.style.color = 'var(--text-muted)';
                span.style.userSelect = 'none';
                return span;
            }

            const btn = document.createElement('button');
            
            if (isNav) {
                btn.className = 'arrow-btn'; 
                if (active) btn.classList.add('active');
                btn.classList.add(navType); 
                btn.id = `review-btn-${navType === 'page-btn-prev' ? 'prev' : 'next'}`;
                this.attachNavSwapListeners(btn);
            } else {
                btn.className = 'pagination-btn';
                if (active) btn.classList.add('active');
            }
            
            btn.innerText = text;
            btn.disabled = disabled;
            
            if (!disabled && !active) {
                btn.onclick = (e) => {
                    if (isNav && this.isSwiping) {
                        e.preventDefault();
                        e.stopPropagation();
                        return;
                    }
                    if (isNav && Date.now() - (this.lastSwapTime || 0) < 300) return;

                    this.reviewCurrentPage = pageIdx;
                    this.renderReview();
                };
            }
            return btn;
        };

        const prevBtn = createBtn('＜', this.reviewCurrentPage - 1, this.reviewCurrentPage === 0, false, true, 'page-btn-prev');
        pagination.appendChild(prevBtn);

        const numbersContainer = document.createElement('div');
        numbersContainer.className = 'pagination-numbers';

        const currentPage = this.reviewCurrentPage;
        
        const maxPageBtns = 3;
        let startPage = Math.max(0, currentPage - 1);
        let endPage = Math.min(totalPages - 1, startPage + maxPageBtns - 1);

        if (endPage - startPage + 1 < maxPageBtns) {
            startPage = Math.max(0, endPage - maxPageBtns + 1);
        }

        if (startPage > 0) {
            numbersContainer.appendChild(createBtn('1', 0, false, currentPage === 0));
            if (startPage > 1) {
                numbersContainer.appendChild(createBtn('...', null));
            }
        }

        for (let i = startPage; i <= endPage; i++) {
            numbersContainer.appendChild(createBtn(String(i + 1), i, false, i === currentPage));
        }

        if (endPage < totalPages - 1) {
            if (endPage < totalPages - 2) {
                numbersContainer.appendChild(createBtn('...', null));
            }
            numbersContainer.appendChild(createBtn(String(totalPages), totalPages - 1, false, currentPage === totalPages - 1));
        }

        pagination.appendChild(numbersContainer);

        const nextBtn = createBtn('＞', this.reviewCurrentPage + 1, this.reviewCurrentPage === totalPages - 1, false, true, 'page-btn-next');
        pagination.appendChild(nextBtn);
    }
};

window.app = app;
document.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
