<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Master - 語彙力強化アプリ</title>
    <style>
        :root {
            /* 共通カラー */
            --primary-color: #4A90E2;
            --primary-hover: #357ABD;
            --primary-light: #E1EFFF;
            --correct-color: #4CAF50;
            --correct-bg: #E8F5E9;
            --incorrect-color: #F44336;
            --incorrect-bg: #FFEBEE;

            /* ライトモード用のカラー */
            --bg-color: #F8F9FA;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #E0E0E0;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);

            /* コンポーネント用のカラー変数 */
            --input-bg: #FAFAFA;
            --btn-sec-bg: #f0f0f0;
            --btn-sec-text: #333333;
            --btn-sec-hover: #e4e4e4;
            --q-bg: #f0f4f8;
            --trans-bg: #eef2f5;
            --trans-border: #8e9eab;
            --hover-bg: #f9f9f9;
            --acc-bg: #fafafa;
            --ex-bg: #ffffff;
            --ex-border: #eeeeee;
            --bm-bg: #ffffff;
            --bm-hover: #f9f9f9;
            --bm-active-bg: #fffdf5;
            --sidebar-list-bg: #ffffff;
            --sidebar-summary-bg: #f0f4f8;

            --transition: all 0.3s ease;
        }

        /* ダークモード用のカラー上書き */
        [data-theme="dark"] {
            --primary-color: #62A4F5;
            --primary-hover: #4A90E2;
            --primary-light: #1C2D42;
            --correct-color: #66BB6A;
            --correct-bg: #1E3324;
            --incorrect-color: #EF5350;
            --incorrect-bg: #3E1E22;

            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --text-main: #E0E0E0;
            --text-muted: #A0A0A0;
            --border-color: #333333;
            --shadow: 0 4px 6px rgba(0,0,0,0.5);

            --input-bg: #2C2C2C;
            --btn-sec-bg: #333333;
            --btn-sec-text: #E0E0E0;
            --btn-sec-hover: #444444;
            --q-bg: #2A2F35;
            --trans-bg: #25282B;
            --trans-border: #667582;
            --hover-bg: #2A2A2A;
            --acc-bg: #242424;
            --ex-bg: #2A2A2A;
            --ex-border: #444444;
            --bm-bg: #1E1E1E;
            --bm-hover: #2A2A2A;
            --bm-active-bg: #332B1A;
            --sidebar-list-bg: #1E1E1E;
            --sidebar-summary-bg: #2A2F35;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            scroll-behavior: smooth; 
            min-height: 100vh;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        #app {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 20px 30px 30px;
            min-height: 80vh;
            position: relative;
            box-sizing: border-box;
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }

        .hidden { display: none !important; }

        h2 { border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; margin-top: 0; }
        .nav-link { color: var(--primary-color); text-decoration: none; font-weight: bold; display: inline-block; cursor: pointer; }
        .nav-link:hover { text-decoration: underline; }

        button {
            background-color: var(--primary-color); color: white; border: none; padding: 10px 20px;
            border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: var(--transition);
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #cccccc; cursor: not-allowed; opacity: 0.5; }

        /* エディタ画面 */
        .editor-container { display: flex; flex-direction: column; gap: 15px; }
        .editor-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: -5px; }
        .btn-secondary { background-color: var(--btn-sec-bg); color: var(--btn-sec-text); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background-color: var(--btn-sec-hover); }

        textarea {
            width: 100%; height: 50vh; padding: 15px; border: 1px solid var(--border-color);
            border-radius: 8px; font-family: monospace; font-size: 14px; resize: vertical; box-sizing: border-box;
            background-color: var(--input-bg); color: var(--text-main); transition: var(--transition);
        }
        textarea:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2); }
        .error-message { color: var(--incorrect-color); background-color: var(--incorrect-bg); padding: 10px; border-radius: 6px; font-size: 14px; font-weight: bold; }
        .editor-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px;}

        /* クイズ画面ヘッダー周り */
        .top-nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .menu-btn { background: none; color: var(--text-main); font-size: 24px; padding: 5px; box-shadow: none; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; margin-left: -5px; }
        .menu-btn:hover { background-color: var(--hover-bg); }

        .quiz-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; flex-wrap: wrap; gap: 10px;}
        .question-number { font-weight: bold; color: var(--text-muted); font-size: 18px; margin-bottom: 5px; }

        /* 矢印ナビゲーション */
        .arrow-nav-container { 
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; 
            transition: flex-direction 0.3s ease; 
        }
        .arrow-nav-container.swapped {
            flex-direction: row-reverse; 
        }
        .arrow-btn { 
            background: none; color: var(--primary-color); font-size: 32px; font-weight: bold; padding: 0 10px; box-shadow: none; border-radius: 4px; 
            cursor: grab; 
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y; 
        }
        .arrow-btn:active { cursor: grabbing; background-color: var(--primary-light); }
        .arrow-btn:hover { background-color: var(--primary-light); }
        .arrow-btn:disabled { color: var(--text-muted); background: none; cursor: not-allowed; opacity: 0.5; }

        /* スクロール位置とタップ領域の調整 */
        .question-text { font-size: 20px; font-weight: bold; margin-bottom: 15px; line-height: 1.5; padding: 15px; background: var(--q-bg); border-radius: 8px; border-left: 5px solid var(--primary-color); scroll-margin-top: 20px; cursor: pointer; transition: var(--transition); }
        .question-translation { font-size: 15px; color: var(--text-muted); margin-bottom: 25px; padding: 12px 15px; background: var(--trans-bg); border-radius: 6px; border-left: 5px solid var(--trans-border); font-weight: 500; animation: fadeIn 0.4s ease-in-out; scroll-margin-top: 20px; cursor: pointer; transition: var(--transition); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* 選択肢とアコーディオン */
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-item { border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; background: var(--card-bg); transition: var(--transition); scroll-margin-top: 20px; }
        .option-button { width: 100%; text-align: left; background: none; border: none; padding: 15px 20px; font-size: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--text-main); font-weight: 500; box-shadow: none; }
        .option-button:hover { background-color: var(--hover-bg); }

        .option-item.answered-correct { border-color: var(--correct-color); }
        .option-item.answered-correct .option-button { background-color: var(--correct-bg); color: var(--correct-color); font-weight: bold; }
        .option-item.answered-incorrect { border-color: var(--incorrect-color); }
        .option-item.answered-incorrect .option-button { background-color: var(--incorrect-bg); color: var(--incorrect-color); }

        .accordion-content { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease; background-color: var(--acc-bg); }
        .accordion-inner { overflow: hidden; }
        .accordion-body { padding: 0 20px 20px 20px; cursor: pointer; }
        .option-item.open .accordion-content { grid-template-rows: 1fr; }
        .option-item.open .option-button { border-bottom: 1px solid var(--border-color); }

        /* 選択肢ごとのブックマークアイコン */
        .opt-bookmark-btn {
            cursor: pointer;
            color: #dcdcdc;
            font-size: 20px;
            transition: var(--transition);
            display: inline-block;
            user-select: none;
            /* デフォルト（右手モード >< ではない時）は右側に配置 */
            order: 2;
            margin-left: auto;
            margin-right: 15px;
        }
        .opt-bookmark-btn:hover { color: #f5a623; }
        .opt-bookmark-btn.active { color: #f5a623; }

        /* テキスト部分 */
        .option-text { 
            flex-grow: 1; 
            text-align: left; 
            order: 1;
        }

        /* アコーディオンアイコン */
        .icon-toggle { order: 3; }

        /* 左手モード（>< の時）は星を左側に戻す */
        body.nav-swapped .opt-bookmark-btn { 
            order: 1; 
            margin-left: 0;
            margin-right: 12px; 
        }
        body.nav-swapped .option-text { order: 2; }


        .result-mark { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
        .mark-o { color: var(--correct-color); }
        .mark-x { color: var(--incorrect-color); }
        .meaning-text { font-weight: bold; margin-bottom: 8px; font-size: 15px; }
        .example-text { color: var(--text-muted); font-size: 14px; line-height: 1.5; font-style: italic; background: var(--ex-bg); padding: 10px; border-radius: 6px; border: 1px solid var(--ex-border); transition: var(--transition); }

        /* 設問全体のブックマークボタン */
        #bookmark-btn {
            background-color: var(--bm-bg);
            color: #ccc;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        #bookmark-btn:hover { background-color: var(--bm-hover); }
        #bookmark-btn.active { color: #f5a623; border-color: #f5a623; background-color: var(--bm-active-bg); }

        /* フッターナビゲーション */
        .bottom-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        /* ページネーション（復習ページ用） */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed var(--border-color);
        }

        /* サイドバー共通 */
        .sidebar-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 99; opacity: 0; visibility: hidden; transition: var(--transition); }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        .sidebar { position: fixed; top: 0; width: 260px; height: 100%; background: var(--card-bg); z-index: 100; box-shadow: 2px 0 8px rgba(0,0,0,0.1); overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .sidebar-header { font-size: 18px; font-weight: bold; border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; margin-bottom: 15px; color: var(--primary-color); display: flex; justify-content: space-between; align-items: center;}
        .close-sidebar-btn { background: none; border: none; font-size: 24px; color: var(--text-muted); cursor: pointer; padding: 0; box-shadow: none; height: 30px; width: 30px; line-height: 1;}
        .close-sidebar-btn:hover { color: var(--incorrect-color); }

        /* 左サイドバー（メニュー） */
        .left-sidebar { left: -300px; transition: left 0.3s ease; }
        .left-sidebar.open { left: 0; }

        /* 右サイドバー（設定） */
        .right-sidebar { right: -300px; transition: right 0.3s ease; left: auto; }
        .right-sidebar.open { right: 0; }

        .sidebar-filters { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
        .sidebar-filters select, #review-per-page { padding: 6px; border-radius: 4px; border: 1px solid var(--border-color); width: 100%; font-family: inherit; background-color: var(--input-bg); color: var(--text-main); }
        .sidebar-filters label { display: flex; align-items: center; gap: 5px; cursor: pointer; }

        .sidebar details { margin-bottom: 10px; border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; }
        .sidebar summary { background: var(--sidebar-summary-bg); padding: 12px 15px; font-weight: bold; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; user-select: none; color: var(--text-main); }
        .sidebar summary::-webkit-details-marker { display: none; }
        .sidebar summary::after { content: "▼"; font-size: 12px; transition: transform 0.3s ease; }
        .sidebar details[open] summary::after { transform: rotate(180deg); }
        .sidebar details[open] summary { border-bottom: 1px solid var(--border-color); background: var(--primary-light); color: var(--primary-hover); }

        .sidebar-list { padding: 5px 0; background: var(--sidebar-list-bg);}
        .sidebar-item { padding: 10px 20px; font-size: 14px; color: var(--text-main); cursor: pointer; border-left: 4px solid transparent; transition: all 0.2s; }
        .sidebar-item:hover { background: var(--hover-bg); }
        .sidebar-item.active { background: var(--primary-light); font-weight: bold; color: var(--primary-color); border-left-color: var(--primary-color); }
    </style>
</head>
<body>

<!-- メニューサイドバー（左） -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="app.toggleSidebar(false)"></div>
<div class="sidebar left-sidebar" id="sidebar">
    <div class="sidebar-header">
        設問メニュー
        <button class="close-sidebar-btn" onclick="app.toggleSidebar(false)">×</button>
    </div>

    <div class="sidebar-filters">
        <select id="difficulty-filter" onchange="app.applyFilters()">
            <option value="all">すべての難易度</option>
            <option value="1">難易度 1</option>
            <option value="2">難易度 2</option>
            <option value="3">難易度 3</option>
            <option value="4">難易度 4</option>
            <option value="5">難易度 5</option>
        </select>
        <label>
            <input type="checkbox" id="bookmark-filter" onchange="app.applyFilters()"> ブックマークのみ表示
        </label>
    </div>

    <div id="sidebar-content"></div>
</div>

<!-- 設定サイドバー（右） -->
<div class="sidebar-overlay" id="settings-overlay" onclick="app.toggleSettings(false)"></div>
<div class="sidebar right-sidebar" id="settings-sidebar">
    <div class="sidebar-header">
        設定
        <button class="close-sidebar-btn" onclick="app.toggleSettings(false)">×</button>
    </div>

    <div class="sidebar-filters">
        <label style="font-weight: bold; margin-bottom: 5px; display: block;">テーマ設定</label>
        <select id="theme-select" onchange="app.changeTheme()">
            <option value="light">ライトモード</option>
            <option value="dark">ダークモード</option>
            <option value="auto">端末の設定に従う</option>
        </select>
    </div>
</div>

<div id="app">
    <!-- 読み込みデータ編集画面 -->
    <div id="editor-view" class="view">
        <div class="top-nav-bar" style="justify-content: flex-end;">
            <a class="nav-link" onclick="app.switchView('quiz')">設問ページへ進む</a>
        </div>
        <h2>読み込みデータ編集</h2>

        <div class="editor-container">
            <div style="margin: 10px 0; padding: 15px; background: var(--q-bg); border-radius: 8px; border-left: 5px solid var(--primary-color);">
                <h3 style="margin-top:0; font-size: 16px;">クラウド同期</h3>
                <p id="login-desc" style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">Googleアカウントでログインすると、別の端末でもブックマークが同期されます。</p>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button id="login-btn" onclick="app.toggleLogin()" style="background-color: #db4437;">Googleでログイン</button>
                    <!-- 手動同期＆クリーンアップボタン -->
                    <button id="sync-btn" onclick="app.syncAndCleanBookmarks()" style="background-color: #4CAF50; display: none;">クラウド同期＆データ整理</button>
                </div>
            </div>

            <div class="editor-toolbar">
                <button class="btn-secondary" onclick="app.clearText()">全削除</button>
                <button class="btn-secondary" onclick="app.copyText()">全コピー</button>
                <button class="btn-secondary" onclick="app.scrollToBottom()">最下部へスクロール</button>
                <button style="background-color: #ff9800; color: white; border: none;" onclick="app.fetchRemoteData(true)">クラウドから最新データを取得</button>
            </div>

            <textarea id="json-input" placeholder="ここにJSONデータを貼り付けてください。複数の配列をペーストしても自動で結合されます。"></textarea>

            <div id="json-error" class="error-message hidden">JSONの形式を満たしていません。記述を確認してください。</div>

            <div class="editor-actions">
                <span style="font-size: 12px; color: var(--text-muted);">※差分がある場合のみボタンが活性化します</span>
                <button id="import-btn" disabled onclick="app.importData()">取り込みボタン</button>
            </div>
        </div>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-view" class="view hidden">
        <div class="top-nav-bar">
            <button class="menu-btn" onclick="app.toggleSidebar(true)">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>

            <!-- 歯車（設定）ボタン -->
            <button class="menu-btn" onclick="app.toggleSettings(true)" style="margin-left: auto; color: var(--text-muted); opacity: 0.6;">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>

        <div class="quiz-header">
            <div>
                <div class="question-number">Question <span id="q-current">1</span> / <span id="q-total">1</span></div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="bookmark-btn" onclick="app.toggleBookmark()">☆ ブックマーク</button>
                <button id="toggle-accordion-btn" onclick="app.toggleAllAccordions()">解答を見る</button>
            </div>
        </div>

        <div class="arrow-nav-container" id="arrow-nav-container">
            <button class="arrow-btn" id="btn-prev" draggable="true" onclick="app.handleNavClick('prev')">＜</button>
            <button class="arrow-btn" id="btn-next" draggable="true" onclick="app.handleNavClick('next')">＞</button>
        </div>

        <div id="question-text" class="question-text"></div>
        <div id="question-translation" class="question-translation hidden"></div>
        <div id="options-container" class="options-list"></div>

        <div class="bottom-nav-bar">
            <a class="nav-link" onclick="app.switchView('editor')">データを編集する</a>
            <a class="nav-link" onclick="app.switchView('review')" style="color: #ff9800;">復習する</a>
        </div>
    </div>

    <!-- 復習ページ画面 -->
    <div id="review-view" class="view hidden">
        <div class="top-nav-bar">
            <a class="nav-link" onclick="app.switchView('quiz')">← 設問ページに戻る</a>
        </div>

        <div class="quiz-header" style="align-items: center; border-bottom: 2px solid var(--primary-color); padding-bottom: 15px; margin-bottom: 20px;">
            <div>
                <h2 style="border: none; padding: 0; margin: 0; font-size: 22px;">復習ページ</h2>
                <div style="font-size: 13px; color: var(--text-muted); margin-top: 5px;">ブックマークした選択肢一覧</div>
            </div>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <select id="review-per-page" onchange="app.changeReviewPerPage()" style="width: auto;">
                    <option value="10">10件表示</option>
                    <option value="20">20件表示</option>
                    <option value="50">50件表示</option>
                </select>
                <button id="review-toggle-accordion-btn" onclick="app.toggleReviewAccordions()">アコーディオンを全開閉</button>
            </div>
        </div>

        <div id="review-list-container" class="options-list"></div>

        <div class="pagination-container" id="review-pagination">
            <button id="review-btn-prev" class="btn-secondary" onclick="app.prevReviewPage()">＜ 前へ</button>
            <span id="review-page-info" style="font-weight: bold; color: var(--text-muted);">1 / 1</span>
            <button id="review-btn-next" class="btn-secondary" onclick="app.nextReviewPage()">次へ ＞</button>
        </div>
    </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyC49VpvSo7xhcX4ytc1XVvswTYRryFeDHM",
    authDomain: "vocabmaster-6736a.firebaseapp.com",
    projectId: "vocabmaster-6736a",
    storageBucket: "vocabmaster-6736a.firebasestorage.app",
    messagingSenderId: "460606872770",
    appId: "1:460606872770:web:58faf647864b979975ef5b"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);

const app = {
    allData: [],      
    data: [],         
    bookmarkedIds: [], 
    bookmarkedOptions: {}, 
    savedJsonString: "[]",
    currentIndex: 0,
    isAllAccordionsOpen: false,
    user: null,

    isNavSwapped: false,
    lastSwapTime: 0,
    longPressTimer: null,

    reviewData: [],
    reviewCurrentPage: 0,
    reviewPerPage: 10,
    isReviewAccordionsOpen: false,

    REMOTE_JSON_URL: "https://raw.githubusercontent.com/enpro697/eitangoapp/refs/heads/main/eitango1.json",

    init() {
        this.initTheme();

        this.allData = [];
        this.data = [];
        this.bookmarkedOptions = {};

        // ★追加：データが読み込まれる前にローカルのブックマーク情報を同期的に復元しておく
        // これにより、初回ロード時にも一番進んでいる問題へ自動で飛ぶことができます。
        this.loadFromLocalStorage();

        const jsonInput = document.getElementById('json-input');
        jsonInput.value = this.savedJsonString;
        jsonInput.addEventListener('input', () => this.validateJsonInput());

        onAuthStateChanged(auth, (user) => {
            const loginBtn = document.getElementById('login-btn');
            const syncBtn = document.getElementById('sync-btn');

            if (user) {
                this.user = user;
                if (loginBtn) {
                    loginBtn.innerText = "ログアウト";
                    loginBtn.style.backgroundColor = "#757575"; 
                }
                if (syncBtn) syncBtn.style.display = "block";
            } else {
                this.user = null;
                if (loginBtn) {
                    loginBtn.innerText = "Googleでログイン";
                    loginBtn.style.backgroundColor = "#db4437"; 
                }
                if (syncBtn) syncBtn.style.display = "none";

                const loginDesc = document.getElementById('login-desc');
                if (loginDesc) loginDesc.innerText = "Googleアカウントでログインすると、別の端末でもブックマークが同期されます。";
            }
            this.loadBookmarks();
        });

        window.addEventListener('online', () => {
            const isUnsynced = localStorage.getItem('vocab_unsynced') === 'true';
            if (isUnsynced && this.user) {
                const loginDesc = document.getElementById('login-desc');
                if (loginDesc) loginDesc.innerHTML = `<span style="color: #ff9800; font-weight: bold;">⚠ オンライン復帰：</span> 未同期のデータがあります。「クラウド同期」ボタンを押してください。`;
            }
        });

        const savedSwap = localStorage.getItem('vocab_nav_swapped');
        if (savedSwap === 'true') {
            this.isNavSwapped = true;
            document.getElementById('arrow-nav-container').classList.add('swapped');
            document.body.classList.add('nav-swapped');
        }

        this.setupDragAndLongPress();
        this.fetchRemoteData(false);
        this.setupGlobalClickListeners();
    },

    // 指定した要素が画面の上部1/3くらいに来るようにスクロールする関数
    scrollToElement(el) {
        if (!el) return;
        const offset = window.innerHeight / 3;
        const y = el.getBoundingClientRect().top + window.scrollY - offset;
        window.scrollTo({ top: y, behavior: 'smooth' });
    },

    initTheme() {
        const savedTheme = localStorage.getItem('vocab_theme') || 'auto';
        const themeSelect = document.getElementById('theme-select');
        if(themeSelect) themeSelect.value = savedTheme;
        this.applyTheme(savedTheme);

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (localStorage.getItem('vocab_theme') === 'auto') {
                this.applyTheme('auto');
            }
        });
    },

    changeTheme() {
        const themeSelect = document.getElementById('theme-select');
        if(!themeSelect) return;
        const theme = themeSelect.value;
        localStorage.setItem('vocab_theme', theme);
        this.applyTheme(theme);
    },

    applyTheme(theme) {
        if (theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.removeAttribute('data-theme');
        }
    },

    toggleSettings(show) {
        const sidebar = document.getElementById('settings-sidebar');
        const overlay = document.getElementById('settings-overlay');
        if (show) {
            sidebar.classList.add('open');
            overlay.classList.add('active');
        } else {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }
    },

    toggleNavSwap() {
        this.isNavSwapped = !this.isNavSwapped;
        this.lastSwapTime = Date.now();
        localStorage.setItem('vocab_nav_swapped', this.isNavSwapped);

        const container = document.getElementById('arrow-nav-container');
        if (this.isNavSwapped) {
            container.classList.add('swapped');
            document.body.classList.add('nav-swapped');
        } else {
            container.classList.remove('swapped');
            document.body.classList.remove('nav-swapped');
        }
        if (navigator.vibrate) navigator.vibrate(50);
    },

    setupDragAndLongPress() {
        const prevBtn = document.getElementById('btn-prev');
        const nextBtn = document.getElementById('btn-next');
        const btns = [prevBtn, nextBtn];

        btns.forEach(btn => {
            btn.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.id);
                e.target.style.opacity = '0.5';
            });
            btn.addEventListener('dragend', (e) => {
                e.target.style.opacity = '1';
            });
            btn.addEventListener('dragover', (e) => {
                e.preventDefault(); 
            });
            btn.addEventListener('drop', (e) => {
                e.preventDefault();
                const draggedId = e.dataTransfer.getData('text/plain');
                const targetBtn = e.target.closest('.arrow-btn');
                if (targetBtn && draggedId && draggedId !== targetBtn.id) {
                    this.toggleNavSwap();
                }
            });
        });

        btns.forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                this.longPressTimer = setTimeout(() => {
                    this.toggleNavSwap();
                    this.longPressTimer = null;
                }, 600); 
            }, { passive: true });

            const cancelLongPress = () => {
                if (this.longPressTimer) {
                    clearTimeout(this.longPressTimer);
                    this.longPressTimer = null;
                }
            };

            btn.addEventListener('touchend', cancelLongPress);
            btn.addEventListener('touchmove', cancelLongPress, { passive: true });
            btn.addEventListener('touchcancel', cancelLongPress);
            btn.addEventListener('contextmenu', (e) => e.preventDefault()); 
        });
    },

    async toggleLogin() {
        if (this.user) {
            await signOut(auth);
            alert("ログアウトしました。これ以降の変更はローカルにのみ保存されます。");
        } else {
            const provider = new GoogleAuthProvider();
            try { await signInWithPopup(auth, provider); } 
            catch(error) { console.error("ログインエラー", error); }
        }
    },

    setupGlobalClickListeners() {
        document.addEventListener('click', (e) => {
            const isQuizView = !document.getElementById('quiz-view').classList.contains('hidden');
            const isReviewView = !document.getElementById('review-view').classList.contains('hidden');

            if (!isQuizView && !isReviewView) return;
            if (e.target.closest('.opt-bookmark-btn') || e.target.closest('button') || e.target.closest('a') || e.target.closest('select')) return;

            if (isReviewView) {
                const accordionBody = e.target.closest('.accordion-body');
                if (accordionBody) {
                    const optionItem = accordionBody.closest('.option-item');
                    const allItems = Array.from(document.querySelectorAll('#review-list-container .option-item'));
                    const currentIndex = allItems.indexOf(optionItem);

                    let targetItem = null;
                    for (let i = currentIndex + 1; i < allItems.length; i++) {
                        if (allItems[i].classList.contains('open')) {
                            targetItem = allItems[i];
                            break;
                        }
                    }
                    if (targetItem) {
                        this.scrollToElement(targetItem);
                    } else {
                        const firstOpen = allItems.find(item => item.classList.contains('open'));
                        if (firstOpen) {
                            this.scrollToElement(firstOpen);
                        } else {
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        }
                    }
                }
                return;
            }

            if (isQuizView) {
                if (e.target.closest('#question-text')) {
                    this.toggleAllAccordions();
                    return;
                }
                if (e.target.closest('#question-translation')) {
                    const options = Array.from(document.querySelectorAll('#options-container .option-item'));
                    const correctIndex = options.findIndex(opt => opt.classList.contains('answered-correct'));
                    if (correctIndex !== -1) {
                        let targetIndex = correctIndex + 1;
                        if (targetIndex >= options.length) targetIndex = 0;
                        const targetEl = document.getElementById(`option-item-${targetIndex}`);
                        this.scrollToElement(targetEl);
                    }
                    return;
                }
                const accordionBody = e.target.closest('.accordion-body');
                if (accordionBody) {
                    const optionItem = accordionBody.closest('.option-item');
                    const options = Array.from(document.querySelectorAll('#options-container .option-item'));
                    const currentIndex = options.indexOf(optionItem);

                    if (optionItem.classList.contains('answered-correct')) {
                        this.scrollToElement(document.getElementById('question-text'));
                    } else {
                        let targetIndex = currentIndex + 1;
                        if (targetIndex >= options.length) {
                            const transEl = document.getElementById('question-translation');
                            if (!transEl.classList.contains('hidden')) {
                                this.scrollToElement(transEl);
                            } else {
                                this.scrollToElement(document.getElementById('question-text'));
                            }
                        } else {
                            const targetEl = document.getElementById(`option-item-${targetIndex}`);
                            this.scrollToElement(targetEl);
                        }
                    }
                    return;
                }
                if (e.target.closest('.sidebar') || e.target.closest('.sidebar-overlay')) return;

                const clickX = e.clientX;
                const screenWidth = window.innerWidth;
                const appEl = document.getElementById('app');

                if (!appEl.contains(e.target) || e.target === appEl) {
                    if (clickX < screenWidth / 2) {
                        this.isNavSwapped ? this.nextPage() : this.prevPage();
                    } else {
                        this.isNavSwapped ? this.prevPage() : this.nextPage();
                    }
                    return;
                }

                if (clickX < screenWidth * 0.15) {
                    this.isNavSwapped ? this.nextPage() : this.prevPage();
                    return;
                }
                if (clickX > screenWidth * 0.85) {
                    this.isNavSwapped ? this.prevPage() : this.nextPage();
                    return;
                }
            }
        });
    },

    async loadBookmarks() {
        const isUnsynced = localStorage.getItem('vocab_unsynced') === 'true';

        if (this.user) {
            if (isUnsynced) {
                this.loadFromLocalStorage();
                const loginDesc = document.getElementById('login-desc');
                if (loginDesc) {
                    loginDesc.innerHTML = `<span style="color: #ff9800; font-weight: bold;">⚠ 未同期の変更あり：</span> オフライン時の変更が残っています。「クラウド同期」ボタンを押して保存してください。`;
                }
            } else {
                try {
                    const docRef = doc(db, "users", this.user.uid);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const dbData = docSnap.data();
                        this.bookmarkedIds = dbData.bookmarks || [];
                        this.bookmarkedOptions = dbData.bookmarkedOptions || {};
                        localStorage.setItem('vocab_bookmarks', JSON.stringify(this.bookmarkedIds)); 
                        localStorage.setItem('vocab_bookmarked_options', JSON.stringify(this.bookmarkedOptions));
                    }
                    const loginDesc = document.getElementById('login-desc');
                    if (loginDesc) {
                        loginDesc.innerHTML = `<span style="color: var(--correct-color); font-weight: bold;">✓ 同期有効：</span> ${this.user.displayName || 'ユーザー'} としてログイン中です。`;
                    }
                } catch(e) { 
                    this.loadFromLocalStorage();
                }
            }
        } else {
            this.loadFromLocalStorage();
        }

        this.updateBookmarkUI();
        this.renderSidebar();

        if (document.getElementById('bookmark-filter').checked) {
            this.applyFilters();
        }
    },

    loadFromLocalStorage() {
        try {
            const savedIds = localStorage.getItem('vocab_bookmarks');
            this.bookmarkedIds = savedIds ? JSON.parse(savedIds) : [];
            const savedOpts = localStorage.getItem('vocab_bookmarked_options');
            this.bookmarkedOptions = savedOpts ? JSON.parse(savedOpts) : {};
        } catch (e) {
            this.bookmarkedIds = [];
            this.bookmarkedOptions = {};
        }
    },

    async saveBookmarks() {
        localStorage.setItem('vocab_bookmarks', JSON.stringify(this.bookmarkedIds));
        localStorage.setItem('vocab_bookmarked_options', JSON.stringify(this.bookmarkedOptions));

        if (this.user) {
            localStorage.setItem('vocab_unsynced', 'true');

            if (!navigator.onLine) {
                const loginDesc = document.getElementById('login-desc');
                if (loginDesc) {
                    loginDesc.innerHTML = `<span style="color: #ff9800; font-weight: bold;">⚠ オフライン：</span> 変更はローカルに保存されました。後で同期してください。`;
                }
                return;
            }

            try {
                await setDoc(doc(db, "users", this.user.uid), {
                    bookmarks: this.bookmarkedIds,
                    bookmarkedOptions: this.bookmarkedOptions
                }, { merge: true });

                localStorage.removeItem('vocab_unsynced');

                const loginDesc = document.getElementById('login-desc');
                if (loginDesc) {
                    loginDesc.innerHTML = `<span style="color: var(--correct-color); font-weight: bold;">✓ 同期有効：</span> ${this.user.displayName || 'ユーザー'} としてログイン中です。`;
                }
            } catch(e) {
                const loginDesc = document.getElementById('login-desc');
                if (loginDesc) {
                    loginDesc.innerHTML = `<span style="color: #ff9800; font-weight: bold;">⚠ 同期エラー：</span> 変更はローカルに保存されました。後で同期してください。`;
                }
            }
        }
    },

    async syncAndCleanBookmarks() {
        if (!this.user) {
            alert("ログインしていません。");
            return;
        }
        if (!navigator.onLine) {
            alert("現在オフラインのため同期できません。通信環境の良いところで再度お試しください。");
            return;
        }
        if (!this.allData || this.allData.length === 0) {
            alert("単語データが読み込まれていません。先に「クラウドから最新データを取得」するか、データを取り込んでください。");
            return;
        }

        const validIds = new Set(this.allData.map(q => String(q.id)));
        const originalCount = this.bookmarkedIds.length;

        this.bookmarkedIds = this.bookmarkedIds.filter(id => validIds.has(id));

        const cleanedOptions = {};
        for (const [qId, options] of Object.entries(this.bookmarkedOptions)) {
            if (validIds.has(qId)) {
                cleanedOptions[qId] = options;
            }
        }
        this.bookmarkedOptions = cleanedOptions;

        const removedCount = originalCount - this.bookmarkedIds.length;

        try {
            localStorage.setItem('vocab_bookmarks', JSON.stringify(this.bookmarkedIds));
            localStorage.setItem('vocab_bookmarked_options', JSON.stringify(this.bookmarkedOptions));

            await setDoc(doc(db, "users", this.user.uid), {
                bookmarks: this.bookmarkedIds,
                bookmarkedOptions: this.bookmarkedOptions
            }, { merge: true });

            localStorage.removeItem('vocab_unsynced');

            const loginDesc = document.getElementById('login-desc');
            if (loginDesc) {
                loginDesc.innerHTML = `<span style="color: var(--correct-color); font-weight: bold;">✓ 同期有効：</span> ${this.user.displayName || 'ユーザー'} としてログイン中です。`;
            }

            let msg = "クラウドと同期し、ローカルの変更を反映しました！\n";
            if (removedCount > 0) {
                msg += `（過去の無効なゴミデータ ${removedCount} 件を削除しました）`;
            } else {
                msg += "（不要なゴミデータはありませんでした）";
            }
            alert(msg);

            this.updateBookmarkUI();
            this.renderSidebar();
            if (document.getElementById('bookmark-filter').checked) {
                this.applyFilters();
            }
        } catch (error) {
            alert("同期に失敗しました。通信環境を確認してください。");
        }
    },

    async copyText() {
        const ta = document.getElementById('json-input');
        if (!ta.value) return;
        try {
            await navigator.clipboard.writeText(ta.value);
            alert("JSONデータをクリップボードにコピーしました！");
        } catch (err) {
            alert("コピーに失敗しました。手動でコピーしてください。");
        }
    },

    toggleBookmark() {
        const q = this.data[this.currentIndex];
        if (!q) return;

        const qId = String(q.id);
        const idx = this.bookmarkedIds.indexOf(qId);

        if (idx > -1) {
            this.bookmarkedIds.splice(idx, 1);
            delete this.bookmarkedOptions[qId];

            const stars = document.querySelectorAll('.opt-bookmark-btn');
            stars.forEach(s => {
                s.innerText = '☆';
                s.classList.remove('active');
            });
        } else {
            this.bookmarkedIds.push(qId);
        }

        this.saveBookmarks();
        this.updateBookmarkUI();
        this.renderSidebar();

        if (document.getElementById('bookmark-filter').checked && idx > -1) {
            this.applyFilters();
        }
    },

    toggleOptionBookmark(event, qId, wordStr, index) {
        event.stopPropagation();

        if (!this.bookmarkedOptions[qId]) {
            this.bookmarkedOptions[qId] = [];
        }

        const idx = this.bookmarkedOptions[qId].indexOf(wordStr);
        const starEl = document.getElementById(`opt-star-${index}`);

        if (idx > -1) {
            this.bookmarkedOptions[qId].splice(idx, 1);
            if (starEl) {
                starEl.innerText = '☆';
                starEl.classList.remove('active');
            }

            if (this.bookmarkedOptions[qId].length === 0) {
                delete this.bookmarkedOptions[qId];
                const qIdx = this.bookmarkedIds.indexOf(qId);
                if (qIdx > -1) this.bookmarkedIds.splice(qIdx, 1);
            }
        } else {
            this.bookmarkedOptions[qId].push(wordStr);
            if (starEl) {
                starEl.innerText = '★';
                starEl.classList.add('active');
            }

            if (!this.bookmarkedIds.includes(qId)) {
                this.bookmarkedIds.push(qId);
            }
        }

        this.saveBookmarks();
        this.updateBookmarkUI();
        this.renderSidebar();

        if (document.getElementById('bookmark-filter').checked && !this.bookmarkedIds.includes(qId)) {
            this.applyFilters();
        }
    },

    updateBookmarkUI() {
        const q = this.data[this.currentIndex];
        const btn = document.getElementById('bookmark-btn');
        if (!q) {
            btn.style.display = 'none';
            return;
        }
        btn.style.display = 'block';

        if (this.bookmarkedIds.includes(String(q.id))) {
            btn.classList.add('active');
            btn.innerText = '★ 設問ブックマーク済';
        } else {
            btn.classList.remove('active');
            btn.innerText = '☆ 設問をブックマーク';
        }
    },

    async fetchRemoteData(isManualClick = false) {
        try {
            if (isManualClick) document.getElementById('json-input').value = "通信中...";

            const response = await fetch(this.REMOTE_JSON_URL); 
            if (!response.ok) throw new Error("Network response was not ok");

            const rawText = await response.text();
            const remoteData = this.parseCustomJSON(rawText); 

            const formattedJson = JSON.stringify(remoteData, null, 2);
            document.getElementById('json-input').value = formattedJson;

            this.importData();

            if (isManualClick) alert("クラウドから最新の単語データを取得し、適用しました！");
        } catch (error) {
            if (isManualClick) {
                alert("データの取得・解析に失敗しました。JSONの記述にエラーがある可能性があります。");
                document.getElementById('json-input').value = this.savedJsonString;
            }
        }
    },

    parseCustomJSON(inputStr) {
        try { return JSON.parse(inputStr); } 
        catch(e) {
            let fixedStr = inputStr.replace(/\]\s*[^\[\]\{\}]*\s*\[/g, ',');
            try { return JSON.parse(fixedStr); } 
            catch(e2) { throw new Error("Invalid JSON format"); }
        }
    },

    normalizeAndReassignIds(rawData) {
        let flatQuestions = [];
        const extractQuestions = (data) => {
            if (Array.isArray(data)) {
                data.forEach(item => extractQuestions(item));
            } else if (data && typeof data === 'object') {
                if (data.question || data.options || data.choices || data.punchline || data.sentence) {
                    flatQuestions.push(data);
                } else if (Array.isArray(data.questions)) {
                    extractQuestions(data.questions);
                } else {
                    for (const key in data) {
                        if (typeof data[key] === 'object') extractQuestions(data[key]);
                    }
                }
            }
        };
        extractQuestions(rawData);

        flatQuestions.forEach((q, index) => {
            if (!q.id) q.id = 'temp_' + (index + 1);
        });

        return flatQuestions;
    },

    validateJsonInput() {
        const inputVal = document.getElementById('json-input').value;
        const errorMsg = document.getElementById('json-error');
        const importBtn = document.getElementById('import-btn');

        if (!inputVal.trim()) {
            errorMsg.classList.add('hidden');
            importBtn.disabled = true;
            return;
        }
        try {
            this.parseCustomJSON(inputVal);
            errorMsg.classList.add('hidden');
            const isDifferent = (inputVal.trim() !== this.savedJsonString);
            importBtn.disabled = !isDifferent;
        } catch (e) {
            errorMsg.classList.remove('hidden');
            importBtn.disabled = true;
        }
    },

    importData() {
        const inputVal = document.getElementById('json-input').value;
        try {
            let parsedData = this.parseCustomJSON(inputVal);
            parsedData = this.normalizeAndReassignIds(parsedData);

            this.allData = parsedData; 
            this.savedJsonString = JSON.stringify(this.allData, null, 2);
            document.getElementById('json-input').value = this.savedJsonString; 
            document.getElementById('import-btn').disabled = true;

            this.applyFilters(); 
            this.switchView('quiz');
        } catch (e) {
            alert('データの取り込みに失敗しました。');
        }
    },

    applyFilters() {
        const diffVal = document.getElementById('difficulty-filter').value;
        const onlyBookmark = document.getElementById('bookmark-filter').checked;

        this.data = this.allData.filter(q => {
            let matchDiff = true;
            if (diffVal !== 'all') {
                matchDiff = (String(q.difficulty) === String(diffVal));
            }
            let matchBookmark = true;
            if (onlyBookmark) {
                matchBookmark = this.bookmarkedIds.includes(String(q.id));
            }
            return matchDiff && matchBookmark;
        });

        this.currentIndex = 0;
        this.renderSidebar();

        if (this.data.length > 0) {
            this.renderQuiz();
        } else {
            document.getElementById('question-text').innerText = "条件に一致する問題がありません。フィルタを変更してください。";
            document.getElementById('options-container').innerHTML = "";
            document.getElementById('question-translation').classList.add('hidden');
            document.getElementById('q-current').innerText = 0;
            document.getElementById('q-total').innerText = 0;
            document.getElementById('btn-prev').disabled = true;
            document.getElementById('btn-next').disabled = true;
            document.getElementById('bookmark-btn').style.display = 'none';
        }
    },

    clearText() {
        document.getElementById('json-input').value = '';
        this.validateJsonInput();
    },

    scrollToBottom() {
        const ta = document.getElementById('json-input');
        ta.scrollTop = ta.scrollHeight;
    },

    switchView(viewName) {
        // エディタ画面からの遷移かどうかを判定
        const isFromEditor = !document.getElementById('editor-view').classList.contains('hidden');

        document.getElementById('editor-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.add('hidden');
        document.getElementById('review-view').classList.add('hidden');
        document.getElementById(`${viewName}-view`).classList.remove('hidden');

        if (viewName === 'quiz' && this.data.length > 0) {
            // エディタ画面からの遷移時のみ、一番大きいブックマーク済みの設問番号に移動する
            if (isFromEditor) {
                let highestIndex = 0;
                // 後ろから検索して最初に見つかったブックマーク済みのインデックスを取得
                for (let i = this.data.length - 1; i >= 0; i--) {
                    if (this.bookmarkedIds.includes(String(this.data[i].id))) {
                        highestIndex = i;
                        break;
                    }
                }
                this.currentIndex = highestIndex;
            }
            this.renderQuiz();
        } else if (viewName === 'review') {
            this.buildReviewData();
            this.renderReview();
        }
    },

    renderQuiz() {
        if (!this.data || this.data.length === 0) return;

        this.isAllAccordionsOpen = false;
        const q = this.data[this.currentIndex];

        document.getElementById('q-current').innerText = this.currentIndex + 1;
        document.getElementById('q-total').innerText = this.data.length;
        document.getElementById('question-text').innerText = q.question || q.word || "問題文がありません";

        const transDiv = document.getElementById('question-translation');
        transDiv.innerText = q.question_ja || q.meaning || q.translation || "";
        transDiv.classList.add('hidden');

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        if (!q.options && !q.choices) {
            container.innerHTML = '<div style="padding: 20px;">この問題には選択肢データがありません。</div>';
            return;
        }

        let shuffledOptions = q.options ? [...q.options] : [...q.choices];
        for (let i = shuffledOptions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledOptions[i], shuffledOptions[j]] = [shuffledOptions[j], shuffledOptions[i]];
        }

        shuffledOptions.forEach((opt, index) => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'option-item';
            itemDiv.id = `option-item-${index}`;

            let wordStr = opt.word || opt;
            let meaningStr = Array.isArray(opt.meanings) ? opt.meanings.join(', ') : (opt.meanings || "");
            let isCorrect = opt.is_correct === true || q.answer === wordStr || q.answer_index === index;
            let exampleStr = opt.example || q.example || q.sentence || q.punchline || "";

            let isOptionBookmarked = this.bookmarkedOptions[q.id] && this.bookmarkedOptions[q.id].includes(wordStr);
            let escapedWordStr = wordStr.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

            itemDiv.innerHTML = `
                <button class="option-button" onclick="app.handleOptionClick(${index}, ${isCorrect})">
                    <span id="opt-star-${index}" class="opt-bookmark-btn ${isOptionBookmarked ? 'active' : ''}" 
                          onclick="app.toggleOptionBookmark(event, '${q.id}', '${escapedWordStr}', ${index})">
                        ${isOptionBookmarked ? '★' : '☆'}
                    </span>
                    <span class="option-text">${index + 1}. ${wordStr}</span>
                    <span class="icon-toggle">▼</span>
                </button>
                <div class="accordion-content">
                    <div class="accordion-inner">
                        <div class="accordion-body">
                            <div class="result-mark ${isCorrect ? 'mark-o' : 'mark-x'}">
                                ${isCorrect ? '〇 正解' : '× 不正解'}
                            </div>
                            ${meaningStr ? `<div class="meaning-text">意味: ${meaningStr}</div>` : ''}
                            <div class="example-text">"${exampleStr}"</div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(itemDiv);
        });

        this.updateNavButtons();
        this.updateSidebarHighlight();
        this.updateBookmarkUI();
        window.scrollTo({ top: 0, behavior: 'auto' }); 
    },

    handleNavClick(direction) {
        if (Date.now() - (this.lastSwapTime || 0) < 300) return;
        if (direction === 'prev') this.prevPage();
        else if (direction === 'next') this.nextPage();
    },

    handleOptionClick(index, isCorrect) {
        const item = document.getElementById(`option-item-${index}`);
        if (item.classList.contains('open')) {
            item.classList.remove('open');
        } else {
            item.classList.add('open');
            item.classList.add(isCorrect ? 'answered-correct' : 'answered-incorrect');
        }
        
        this.checkTranslationVisibility();

        // 正解した場合は日本語訳（または問題文）へスクロール
        if (item.classList.contains('open') && isCorrect) {
            setTimeout(() => {
                const transEl = document.getElementById('question-translation');
                if (transEl && !transEl.classList.contains('hidden')) {
                    this.scrollToElement(transEl);
                } else {
                    this.scrollToElement(document.getElementById('question-text'));
                }
            }, 300);
        }
    },

    toggleAllAccordions() {
        this.isAllAccordionsOpen = !this.isAllAccordionsOpen;
        const items = document.querySelectorAll('#quiz-view .option-item');
        let hasCorrect = false;

        items.forEach((item) => {
            const isCorrect = item.querySelector('.mark-o') !== null;
            if (this.isAllAccordionsOpen) {
                item.classList.add('open');
                item.classList.add(isCorrect ? 'answered-correct' : 'answered-incorrect');
                if (isCorrect) hasCorrect = true; 
            } else {
                item.classList.remove('open');
            }
        });
        
        this.checkTranslationVisibility();

        if (this.isAllAccordionsOpen && hasCorrect) {
            setTimeout(() => {
                const transEl = document.getElementById('question-translation');
                if (transEl && !transEl.classList.contains('hidden')) {
                    this.scrollToElement(transEl);
                } else {
                    this.scrollToElement(document.getElementById('question-text'));
                }
            }, 300);
        }
    },

    checkTranslationVisibility() {
        const openItemsCount = document.querySelectorAll('#quiz-view .option-item.open').length;
        const transDiv = document.getElementById('question-translation');
        if (openItemsCount > 0 && transDiv.innerText.trim() !== "") {
            transDiv.classList.remove('hidden');
        } else {
            transDiv.classList.add('hidden');
        }
    },

    prevPage() {
        if (this.currentIndex > 0) {
            this.currentIndex--;
            this.renderQuiz();
        }
    },

    nextPage() {
        if (this.currentIndex < this.data.length - 1) {
            this.currentIndex++;
            this.renderQuiz();
        }
    },

    goToPage(index) {
        if (index >= 0 && index < this.data.length) {
            this.currentIndex = index;
            this.renderQuiz();
        }
    },

    updateNavButtons() {
        document.getElementById('btn-prev').disabled = (this.currentIndex === 0);
        document.getElementById('btn-next').disabled = (this.currentIndex === this.data.length - 1);
    },

    toggleSidebar(show) {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        if (show) {
            sidebar.classList.add('open');
            overlay.classList.add('active');
        } else {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }
    },

    renderSidebar() {
        const container = document.getElementById('sidebar-content');
        container.innerHTML = '';

        if(this.data.length === 0) {
             container.innerHTML = '<div style="padding: 10px; color: var(--text-muted); font-size: 14px;">該当する問題がありません。</div>';
             return;
        }

        const groupSize = 50;
        const totalGroups = Math.ceil(this.data.length / groupSize);

        for (let g = 0; g < totalGroups; g++) {
            const start = g * groupSize + 1;
            const end = Math.min((g + 1) * groupSize, this.data.length);

            const details = document.createElement('details');
            const summary = document.createElement('summary');
            summary.innerText = `${start} 〜 ${end} 件目`;
            details.appendChild(summary);

            const list = document.createElement('div');
            list.className = 'sidebar-list';

            for (let i = start - 1; i < end; i++) {
                const item = document.createElement('div');
                item.className = 'sidebar-item';
                item.id = `sidebar-item-${i}`;

                const qId = String(this.data[i].id);
                const isBookmarked = this.bookmarkedIds.includes(qId);
                const icon = isBookmarked ? '★ ' : '';

                item.innerText = `${icon}Question ${i + 1}`;
                item.onclick = () => {
                    this.goToPage(i);
                    this.toggleSidebar(false);
                };
                list.appendChild(item);
            }
            details.appendChild(list);
            container.appendChild(details);
        }
    },

    updateSidebarHighlight() {
        document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
        const activeEl = document.getElementById(`sidebar-item-${this.currentIndex}`);
        if (activeEl) {
            activeEl.classList.add('active');
            const parentDetails = activeEl.closest('details');
            if (parentDetails) parentDetails.open = true;
            activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    },

    buildReviewData() {
        this.reviewData = [];
        for (const q of this.allData) {
            const bOpts = this.bookmarkedOptions[q.id];
            if (bOpts && bOpts.length > 0) {
                const options = q.options || q.choices || [];
                for (const opt of options) {
                    let wordStr = opt.word || opt;
                    if (bOpts.includes(wordStr)) {
                        let meaningStr = Array.isArray(opt.meanings) ? opt.meanings.join(', ') : (opt.meanings || "");
                        let exampleStr = opt.example || q.example || q.sentence || q.punchline || "";

                        this.reviewData.push({
                            qId: String(q.id),
                            wordStr: wordStr,
                            meaningStr: meaningStr,
                            exampleStr: exampleStr
                        });
                    }
                }
            }
        }
        this.reviewCurrentPage = 0;
    },

    renderReview() {
        const container = document.getElementById('review-list-container');
        container.innerHTML = '';

        const pagination = document.getElementById('review-pagination');
        if (this.reviewData.length === 0) {
            container.innerHTML = '<div style="padding: 30px; text-align: center; color: var(--text-muted); background: var(--hover-bg); border-radius: 8px;">ブックマークされた選択肢はありません。</div>';
            pagination.style.display = 'none';
            return;
        }

        pagination.style.display = 'flex';
        this.isReviewAccordionsOpen = false;

        const startIdx = this.reviewCurrentPage * this.reviewPerPage;
        const endIdx = Math.min(startIdx + this.reviewPerPage, this.reviewData.length);

        for (let i = startIdx; i < endIdx; i++) {
            const item = this.reviewData[i];
            const itemDiv = document.createElement('div');
            itemDiv.className = 'option-item';
            itemDiv.id = `review-item-${i}`;

            let escapedWordStr = item.wordStr.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

            let isOptionBookmarked = this.bookmarkedOptions[item.qId] && this.bookmarkedOptions[item.qId].includes(item.wordStr);

            itemDiv.innerHTML = `
                <button class="option-button" onclick="app.handleReviewOptionClick(${i})">
                    <span id="review-star-${i}" class="opt-bookmark-btn ${isOptionBookmarked ? 'active' : ''}" 
                          onclick="app.toggleReviewBookmark(event, '${item.qId}', '${escapedWordStr}', ${i})">
                        ${isOptionBookmarked ? '★' : '☆'}
                    </span>
                    <span class="option-text">${item.wordStr}</span>
                    <span class="icon-toggle">▼</span>
                </button>
                <div class="accordion-content">
                    <div class="accordion-inner">
                        <div class="accordion-body" style="padding-top: 10px;">
                            ${item.meaningStr ? `<div class="meaning-text" style="color: var(--primary-color);">意味: ${item.meaningStr}</div>` : ''}
                            ${item.exampleStr ? `<div class="example-text">"${item.exampleStr}"</div>` : ''}
                            ${!item.meaningStr && !item.exampleStr ? '<div class="example-text">詳細データがありません</div>' : ''}
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(itemDiv);
        }

        this.updateReviewPagination();
        window.scrollTo({ top: 0, behavior: 'auto' });
    },

    handleReviewOptionClick(index) {
        const item = document.getElementById(`review-item-${index}`);
        if (item.classList.contains('open')) {
            item.classList.remove('open');
        } else {
            item.classList.add('open');
        }
    },

    toggleReviewAccordions() {
        this.isReviewAccordionsOpen = !this.isReviewAccordionsOpen;
        const items = document.querySelectorAll('#review-view .option-item');
        items.forEach((item) => {
            if (this.isReviewAccordionsOpen) {
                item.classList.add('open');
            } else {
                item.classList.remove('open');
            }
        });
    },

    toggleReviewBookmark(event, qId, wordStr, index) {
        event.stopPropagation();

        const starEl = document.getElementById(`review-star-${index}`);
        const isCurrentlyBookmarked = starEl.classList.contains('active');

        if (isCurrentlyBookmarked) {
            if (this.bookmarkedOptions[qId]) {
                const idx = this.bookmarkedOptions[qId].indexOf(wordStr);
                if (idx > -1) {
                    this.bookmarkedOptions[qId].splice(idx, 1);
                }
                if (this.bookmarkedOptions[qId].length === 0) {
                    delete this.bookmarkedOptions[qId];
                    const qIdx = this.bookmarkedIds.indexOf(qId);
                    if (qIdx > -1) this.bookmarkedIds.splice(qIdx, 1);
                }
            }
            starEl.innerText = '☆';
            starEl.classList.remove('active');
        } else {
            if (!this.bookmarkedOptions[qId]) {
                this.bookmarkedOptions[qId] = [];
            }
            if (!this.bookmarkedOptions[qId].includes(wordStr)) {
                this.bookmarkedOptions[qId].push(wordStr);
            }
            if (!this.bookmarkedIds.includes(qId)) {
                this.bookmarkedIds.push(qId);
            }
            starEl.innerText = '★';
            starEl.classList.add('active');
        }

        this.saveBookmarks();
        this.updateBookmarkUI();
        this.renderSidebar();
    },

    changeReviewPerPage() {
        this.reviewPerPage = parseInt(document.getElementById('review-per-page').value, 10);
        this.reviewCurrentPage = 0; 
        this.renderReview();
    },

    prevReviewPage() {
        if (this.reviewCurrentPage > 0) {
            this.reviewCurrentPage--;
            this.renderReview();
        }
    },

    nextReviewPage() {
        const totalPages = Math.ceil(this.reviewData.length / this.reviewPerPage);
        if (this.reviewCurrentPage < totalPages - 1) {
            this.reviewCurrentPage++;
            this.renderReview();
        }
    },

    updateReviewPagination() {
        const totalPages = Math.ceil(this.reviewData.length / this.reviewPerPage) || 1;
        document.getElementById('review-page-info').innerText = `${this.reviewCurrentPage + 1} / ${totalPages}`;

        document.getElementById('review-btn-prev').disabled = (this.reviewCurrentPage === 0);
        document.getElementById('review-btn-next').disabled = (this.reviewCurrentPage === totalPages - 1);
    }
};

window.app = app;
document.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
